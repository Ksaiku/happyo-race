<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月例発表会カップ - 発表順決めレース</title>
<style>
:root{
  --bg:#0a0f24; --bg2:#141c3d; --fg:#ffffff; --dim:#b9c4ee;
  --gold:#ffd23f; --cyan:#3be0ff; --red:#ff4d6d; --green:#5dff9c;
  --ana:#ffb347; --kai:#7fe3ff;
  font-family:"Yu Gothic UI","Meiryo","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--fg)}
body{background:radial-gradient(ellipse at 50% 0%,#1f2a63 0%,var(--bg) 65%)}
button,input,textarea{font-family:inherit}
.hidden{display:none !important}
[hidden]{display:none !important}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:flex;flex-direction:column}

/* 右上コントロール */
#controls{position:fixed;top:.5vh;right:1vw;z-index:100;display:flex;gap:8px}
#controls button{background:#000a;color:var(--fg);border:2px solid #fff8;border-radius:999px;padding:3px 12px;font-size:clamp(14px,1.7vh,22px);font-weight:700;cursor:pointer}
#controls button.off{opacity:.6;text-decoration:line-through}
#controls button:hover{border-color:var(--gold)}
#shareNote{position:fixed;top:calc(1vh + 52px);right:1vw;z-index:100;max-width:34vw;background:#000d;border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:clamp(14px,1.8vh,22px);line-height:1.4}

/* ロゴ */
.logo{text-align:center;padding:3vh 2vw 1vh;flex:none}
.logoTop{letter-spacing:.35em;color:var(--gold);font-weight:800;font-size:clamp(12px,1.8vh,22px)}
.logoMain{display:inline-block;margin-top:.6vh;padding:.4vh 2vw;font-size:clamp(34px,7vh,92px);font-weight:900;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff 0%,#ffe27a 45%,#ff9f1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .5vh 0 #7a3b00) drop-shadow(0 0 1.6vh #ff9f1c88);
  border-top:.6vh solid var(--gold);border-bottom:.6vh solid var(--gold)}
.trophy{-webkit-text-fill-color:initial;margin-right:.4em}
.logoSub{margin-top:.6vh;font-size:clamp(16px,2.6vh,34px);font-weight:800;color:var(--cyan);letter-spacing:.3em}

/* 準備 */
.setupBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.2vh;width:min(900px,92vw);margin:0 auto;padding-bottom:2.5vh}
.fieldLabel{font-size:clamp(16px,2.4vh,30px);font-weight:800;color:var(--gold)}
#names{flex:1;min-height:0;resize:none;background:#05081a;color:var(--fg);border:3px solid var(--cyan);border-radius:14px;padding:1.2vh 1.2vw;font-size:clamp(20px,3.2vh,40px);line-height:1.35;font-weight:700}
#names:focus{outline:none;border-color:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:1vh 2vw;align-items:center;font-size:clamp(16px,2.4vh,30px);font-weight:700}
.opts input[type=text],.opts input[type=number]{background:#05081a;color:var(--fg);border:2px solid var(--cyan);border-radius:8px;padding:.3vh .6vw;font-size:inherit;font-weight:800;width:5.5em;text-align:center}
.opts input[type=number]{width:4.2em}
.opts .chk input{width:1.1em;height:1.1em;vertical-align:middle}
.msg{min-height:2.4em;font-size:clamp(16px,2.4vh,30px);font-weight:800;color:var(--red)}
.msg.ok{color:var(--green)}
.bigBtn{flex:none;background:linear-gradient(180deg,#ffe27a,#ff9f1c);color:#2a1300;border:0;border-radius:16px;padding:1.4vh 2vw;font-size:clamp(24px,4.2vh,56px);font-weight:900;cursor:pointer;box-shadow:0 .8vh 0 #8a4a00}
.bigBtn:hover{filter:brightness(1.08)}
.bigBtn:active{transform:translateY(.5vh);box-shadow:0 .3vh 0 #8a4a00}
.bigBtn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}

/* レース */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#telop{position:absolute;left:0;right:24vw;top:.7vh;text-align:center;z-index:20;pointer-events:none}
#telop span{display:inline-block;max-width:74vw;padding:.4vh 1.6vw;background:#000e;border-top:.5vh solid var(--gold);border-bottom:.5vh solid var(--gold);
  font-size:clamp(32px,5vh,100px);font-weight:900;line-height:1.2;text-shadow:0 0 1.2vh #000;animation:pop .3s ease-out}
#telop.big span{color:var(--gold);font-size:clamp(34px,5.4vh,110px)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#telop.lc span{font-size:clamp(28px,4.2vh,84px);color:var(--cyan);border-color:var(--cyan);animation:pop .2s ease-out}
#spurt{position:absolute;left:0;right:0;top:15vh;z-index:22;pointer-events:none;overflow:hidden;
  background:repeating-linear-gradient(115deg,#c1121fe6 0 28px,#8a0a14e6 28px 56px);border-top:.6vh solid #fff;border-bottom:.6vh solid #fff;
  animation:spurtIn .3s cubic-bezier(.2,1.3,.4,1) both,throb .5s ease-in-out .3s 2,spurtOut .35s ease-in 1.15s forwards}
@keyframes spurtOut{to{transform:translateX(110%) skewX(-12deg);opacity:.2}}
#spurt span{display:block;text-align:center;padding:.6vh 0;font-size:clamp(44px,8vh,150px);font-weight:900;letter-spacing:.12em;color:#fff;text-shadow:0 .6vh 0 #000,0 0 3vh #ffd23f}
@keyframes spurtIn{from{transform:translateX(-110%) skewX(-12deg)}to{transform:translateX(0) skewX(0)}}
@keyframes throb{50%{filter:brightness(1.35)}}
#sub{position:absolute;left:0;right:0;bottom:2vh;text-align:center;z-index:32;pointer-events:none}
#sub span{display:inline-block;max-width:94vw;padding:.8vh 2vw;background:#000d;border-radius:14px;font-size:clamp(32px,3.4vh,70px);font-weight:800;line-height:1.3;border:.4vh solid currentColor}
#sub.ana span{color:var(--ana)} #sub.kai span{color:var(--kai)}
#sub b{font-size:.7em;margin-right:.6em;padding:0 .5em;border-radius:6px;background:currentColor}
#sub b i{font-style:normal;color:#000}
#sub .tx{color:#fff}
#freezeMsg{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;background:#808080aa}
#freezeMsg .fz{font-size:clamp(48px,9vh,140px);font-weight:900;color:#fff;text-shadow:0 0 2vh #000;letter-spacing:.1em}
#freezeMsg .ring{width:10vh;height:10vh;border:1.2vh solid #fff5;border-top-color:#fff;border-radius:50%;margin-top:3vh;animation:spin 1s linear infinite}
#freezeMsg.liar{background:transparent}
#freezeMsg.liar .fz{color:var(--gold);animation:pop .3s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
#count{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(160px,38vh,520px);font-weight:900;color:var(--gold);
  text-shadow:0 0 3vh #000,0 0 8vh #ff9f1c}
#count span{animation:pop .4s ease-out}
#skipHint{position:absolute;left:0;right:0;bottom:1.5vh;text-align:center;z-index:50;color:var(--dim);font-size:clamp(14px,2vh,26px);pointer-events:none}

/* レース前ボード */
#intro{position:absolute;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:#050a1ccc;cursor:pointer}
.board{width:min(1100px,90vw);text-align:center;padding:3vh 3vw;border-radius:28px;border:.8vh solid var(--gold);background:linear-gradient(180deg,#1b2a73,#0b1236);box-shadow:0 0 6vh #000;animation:pop .35s ease-out}
.bTitle{font-size:clamp(28px,5vh,68px);font-weight:900;color:var(--gold);letter-spacing:.08em}
.bBig{font-size:clamp(120px,26vh,360px);line-height:1.1}
.bLabel{font-size:clamp(48px,9vh,130px);font-weight:900}
.bText{margin-top:1vh;font-size:clamp(28px,5vh,68px);font-weight:800;color:var(--cyan);line-height:1.3}
.board.envb .bBig{font-size:clamp(100px,20vh,280px)}
.seal{display:inline-block;margin:1vh 0;padding:.6vh 2vw;border-radius:999px;background:radial-gradient(circle at 35% 30%,#ff7a8a,#b0102b);border:.6vh solid #7a0016;font-size:clamp(40px,8vh,110px);font-weight:900;letter-spacing:.12em;font-family:Consolas,"Courier New",monospace}

/* 写真判定フィルム */
#film{position:absolute;left:7vw;top:13vh;width:52vw;z-index:25;pointer-events:none;animation:pop .3s ease-out}
.filmStrip{background:#050505;padding:3.4vh 1.2vw;border-radius:6px;
  background-image:repeating-linear-gradient(90deg,transparent 0 14px,#d8d0b8 14px 28px);
  background-size:100% 1.6vh;background-repeat:no-repeat;background-position:0 .7vh;position:relative;border:2px solid #222}
.filmStrip::after{content:"";position:absolute;left:0;right:0;bottom:.7vh;height:1.6vh;background-image:repeating-linear-gradient(90deg,transparent 0 14px,#d8d0b8 14px 28px)}
.filmWin{position:relative;border:3px solid #111;line-height:0}
#filmCv{width:100%;height:auto;display:block;filter:sepia(.85) grayscale(.55) contrast(1.15) brightness(.95)}
.filmTag{position:absolute;left:.6vw;top:.6vh;line-height:1.2;font-size:clamp(14px,2vh,28px);font-weight:900;color:#f3e6bd;background:#000a;padding:.2vh .6vw;letter-spacing:.2em}
.filmInfo{display:flex;align-items:center;gap:1.4vw;margin-top:1vh;background:#000d;border-radius:12px;padding:1vh 1.2vw;min-height:9vh}
#lamps{display:flex;gap:1vw;flex:none}
#lamps i{display:block;width:5vh;height:5vh;border-radius:50%;background:#3a1010;border:.4vh solid #666;transition:none}
#lamps i.on{background:radial-gradient(circle at 35% 30%,#fff,#ffd23f 40%,#ff7a00);box-shadow:0 0 3vh #ffb300;border-color:#fff}
#lamps i.final{background:radial-gradient(circle at 35% 30%,#fff,#5dff9c 40%,#00b35a);box-shadow:0 0 4vh #5dff9c}
#verdict{white-space:nowrap;font-size:clamp(24px,3.8vh,60px);font-weight:900;color:var(--gold);line-height:1.2}

/* 結果 */
#result{padding:1.5vh 2vw 1.5vh;gap:1vh}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
#confetti i{position:absolute;top:-8vh;display:block;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.resHead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:2vw;padding-right:0;position:relative;z-index:6;padding-top:3.4vh}
.resTitle{font-size:clamp(28px,5vh,72px);font-weight:900;color:var(--gold)}
.env{background:#2a1f10;color:#fff;border:.4vh solid var(--gold);border-radius:14px;padding:.8vh 1.4vw;font-size:clamp(18px,2.8vh,38px);font-weight:800;cursor:pointer}
.env b{font-family:Consolas,"Courier New",monospace;letter-spacing:.1em;color:var(--gold);font-size:1.15em}
.env.open{background:#16361f;border-color:var(--green);animation:pop .4s ease-out}
#podium{flex:none;height:31vh;display:flex;justify-content:center;align-items:flex-end;gap:1.4vw;position:relative;z-index:6}
.pod{display:flex;flex-direction:column;align-items:center;width:26vw;max-width:420px}
.pod .who{font-size:clamp(26px,4.4vh,64px);font-weight:900;text-align:center;line-height:1.15;padding-bottom:.6vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pod .block{width:100%;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:clamp(30px,5.6vh,80px);font-weight:900;color:#1a1000;padding-top:.4vh}
.pod.p1 .block{height:15vh;background:linear-gradient(180deg,#fff0a0,#e0a800)}
.pod.p2 .block{height:10.5vh;background:linear-gradient(180deg,#f2f5ff,#9aa6c4)}
.pod.p3 .block{height:7vh;background:linear-gradient(180deg,#ffd0a0,#c0702a)}
.pod.p1 .who{color:var(--gold);font-size:clamp(30px,5.2vh,76px)}
#orderList{flex:1;min-height:0;margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr;grid-auto-flow:column;position:relative;z-index:6;
  gap:.5vh 2vw;align-content:start;padding-top:.6vh}
#orderList li{display:flex;align-items:center;gap:1.2vw;background:#ffffff14;border-left:.8vh solid var(--cyan);border-radius:8px;padding:0 1vw;
  font-size:clamp(22px,3.5vh,50px);font-weight:900;white-space:nowrap;overflow:hidden;animation:pop .35s ease-out backwards}
.vh{display:inline-block;margin-right:.15em}
.lk{display:inline-block;margin-right:.3em;font-size:.85em;white-space:nowrap}
#orderList .rk{color:var(--gold);min-width:1.6em;text-align:right}
#orderList .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
#orderList .tm{color:var(--dim);font-size:.75em;font-weight:800}
#orderList.two{grid-template-columns:1fr 1fr}
.resBtns{flex:none;display:flex;gap:1.4vw;justify-content:center;position:relative;z-index:6;padding-top:.5vh}
.resBtns button{background:#1e2b66;color:#fff;border:.4vh solid #fff8;border-radius:14px;padding:1vh 1.6vw;font-size:clamp(18px,2.8vh,38px);font-weight:900;cursor:pointer}
.resBtns button.primary{background:linear-gradient(180deg,#ffe27a,#ff9f1c);color:#2a1300;border-color:#8a4a00}
.resBtns button:hover{filter:brightness(1.15)}

</style>
</head>
<body>

<div id="controls">
  <button id="btnSound" type="button" title="音のオン/オフ">🔊 音 ON</button>
  <button id="btnSpeech" type="button" title="実況の読み上げ">🗣 読み上げ ON</button>
  <button id="btnShare" type="button" title="Teams共有の注意">ℹ 音の共有</button>
</div>
<div id="shareNote" hidden>Teamsで音を共有するには『コンピューターのサウンドを含める』をオン</div>

<!-- 準備 -->
<section id="setup" class="screen active">
  <div class="logo">
    <div class="logoTop">★ MONTHLY PRESENTATION CUP ★</div>
    <div class="logoMain"><span class="trophy">🏆</span>月例発表会カップ</div>
    <div class="logoSub">発表順決めレース</div>
  </div>
  <div class="setupBody">
    <label class="fieldLabel" for="names">出走メンバー（1行に1人・貼り付けOK）</label>
    <textarea id="names" spellcheck="false" autocomplete="off"></textarea>
    <div class="opts">
      <label>発表開始時刻 <input id="optStart" type="text" value="13:00" size="5" inputmode="numeric"></label>
      <label>1人あたり <input id="optMin" type="number" value="8" min="1" max="120"> 分</label>
      <label class="chk"><input id="optSpeech" type="checkbox" checked> 実況を読み上げる</label>
    </div>
    <div id="setupMsg" class="msg"></div>
    <button id="btnStart" type="button" class="bigBtn">🏁 スタート（スペース）</button>
  </div>
</section>

<!-- レース -->
<section id="race" class="screen">
  <canvas id="cv"></canvas>
  <div id="telop" class="hidden"></div>
  <div id="spurt" class="hidden"></div>
  <div id="sub" class="hidden"></div>
  <div id="freezeMsg" class="hidden"></div>
  <div id="count" class="hidden"></div>
  <div id="intro" class="hidden"></div>
  <div id="film" class="hidden">
    <div class="filmStrip">
      <div class="filmWin"><canvas id="filmCv"></canvas><div class="filmTag">PHOTO FINISH</div></div>
    </div>
    <div class="filmInfo">
      <div id="lamps"><i></i><i></i><i></i></div>
      <div id="verdict"></div>
    </div>
  </div>
  <div id="skipHint" class="hidden">スペース / クリックでスキップ</div>
</section>

<!-- 結果 -->
<section id="result" class="screen">
  <div id="confetti"></div>
  <div class="resHead">
    <div class="resTitle">🏆 発表順が決まりました！</div>
    <button id="envelope" type="button" class="env"></button>
  </div>
  <div id="podium"></div>
  <ol id="orderList"></ol>
  <div class="resBtns">
    <button id="btnCopy" type="button">📋 タイムテーブルをコピー</button>
    <button id="btnAgain" type="button" class="primary">🔁 もう一度</button>
    <button id="btnChange" type="button">✏ メンバー変更</button>
  </div>
</section>

<script>
/* core.js */
var RR = (typeof window !== 'undefined') ? (window.RR = window.RR || {}) : {};

RR.Core = (function () {
  'use strict';

  // ---------------------------------------------------------------- RNG
  function randomSeed32() {
    try {
      if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
        return crypto.getRandomValues(new Uint32Array(1))[0] >>> 0;
      }
    } catch (e) { /* fallthrough */ }
    try {
      if (typeof require === 'function') {
        return require('crypto').randomInt(0, 4294967296) >>> 0;
      }
    } catch (e2) { /* fallthrough */ }
    return Math.floor(Math.random() * 4294967296) >>> 0;
  }

  function createRng(seed) {
    var s;
    if (seed === undefined || seed === null) s = randomSeed32();
    else if (typeof seed === 'number') s = seed >>> 0;
    else s = fnv1a(String(seed)) >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function fnv1a(str, seed) {
    var h = (seed === undefined ? 0x811c9dc5 : seed) >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function fmix(h) {
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return h >>> 0;
  }

  var SEAL_ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';

  function sealCode(order, names) {
    var s = order.map(function (i) { return names[i]; }).join('\u0001') + '|' + order.join(',');
    var h1 = fmix(fnv1a(s));
    var h2 = fmix(fnv1a(s + '#seal', 0x2545F491));
    var c = [];
    for (var j = 0; j < 6; j++) c.push(SEAL_ALPHABET.charAt((h1 >>> (5 * j)) & 31));
    c.push(SEAL_ALPHABET.charAt(h2 & 31));
    return c[0] + c[1] + '-' + c[2] + c[3] + c[4] + '-' + c[5] + c[6];
  }

  // ---------------------------------------------------------------- data
  var VEHICLES = [
    { id: 'horse',   emoji: '🐎', label: '馬',                 counter: '頭' },
    { id: 'snail',   emoji: '🐌', label: 'カタツムリ',         counter: '匹' },
    { id: 'turtle',  emoji: '🐢', label: 'カメ',               counter: '匹' },
    { id: 'duck',    emoji: '🦆', label: 'アヒル',             counter: '羽' },
    { id: 'cart',    emoji: '🛒', label: 'ショッピングカート', counter: '台' },
    { id: 'chair',   emoji: '🪑', label: 'イス',               counter: '脚' },
    { id: 'pig',     emoji: '🐖', label: 'ブタ',               counter: '頭' },
    { id: 'rocket',  emoji: '🚀', label: 'ロケット',           counter: '機' },
    { id: 'bike',    emoji: '🚲', label: '自転車',             counter: '台' },
    { id: 'penguin', emoji: '🐧', label: 'ペンギン',           counter: '羽' }
  ];

  var WEATHERS = [
    { id: 'sunny',  emoji: '☀️',         label: '快晴',   forecast: '終日快晴、ただしレース後半にところにより波乱', note: '日差しは強いですが、走者には追い風と言えそうです' },
    { id: 'rain',   emoji: '🌧️',   label: '雨',     forecast: '午後から本降り、足元の悪い中での勝負です',     note: '路面が滑りやすいので、転倒には要注意ですね' },
    { id: 'fog',    emoji: '🌫️',   label: '濃霧',   forecast: '午後から濃霧、ところにより波乱',             note: '視界が悪く、思わぬ位置取りの変化が起きそうです' },
    { id: 'snow',   emoji: '❄️',         label: '雪',     forecast: '大粒の雪が舞い、ところにより逆転',           note: '雪は走りにくいですが、その分展開が読めません' },
    { id: 'sunset', emoji: '🌇',         label: '夕焼け', forecast: '夕焼けが広がり、終盤に大どんでん返しの予感', note: '夕日が長い影を作っています。終盤の駆け引きに注目です' },
    { id: 'night',  emoji: '🌙',         label: '夜',     forecast: '月明かりの下、静かな夜のレースになります',   note: '暗い中でも名前札がよく見えます。見失わないように' },
    { id: 'wind',   emoji: '💨',         label: '強風',   forecast: '強風注意、追い風と向かい風が入り乱れます',   note: '風向き次第で順位が入れ替わりますよ' }
  ];

  var TEXTS = {
    stumble: ['{n}、まさかの転倒！', '{n}、落とし物を拾いに戻る！', '{n}、靴ひもが…！立ち止まった！', '{n}、突然のストップ！'],
    boost:   ['{n}、急加速！', '{n}、ターボ点火！', '{n}、追い風をつかんだ！'],
    reverse: ['{n}、まさかの逆走！？', '{n}、忘れ物に気づいて引き返す！？', '{n}、道を間違えた！？'],
    swap:    ['閃光！{n}と{m}が入れ替わった！？', 'まぶしい！{n}と{m}の位置が入れ替わった！？', '謎の光！{n}と{m}が入れ替わった！？']
  };

  // material for the app's live commentary ({n}, {m} = "名前さん")
  var PHRASES = {
    lead:   ['{n}が先頭！', '先頭は{n}！', '{n}、前に出た！'],
    change: ['先頭交代！{n}！', '{n}が抜いた！', '{n}がトップ！'],
    chase:  ['{n}、追い上げる！', '{n}が迫る！', '{n}、じわじわ前へ！'],
    last:   ['{n}、まだ諦めない！', '{n}、最後尾から！'],
    final:  ['ラストスパート！', '勝負はここから！'],
    photo:  ['{n}か！{m}か！', '{n}と{m}、並んだ！']
  };

  // ---------------------------------------------------------------- helpers
  function w(x) { return x >= 1 ? 0 : (x <= 0 ? 1 : 0.5 * (1 + Math.cos(Math.PI * x))); }
  function ease(x) { return x <= 0 ? 0 : (x >= 1 ? 1 : 0.5 * (1 - Math.cos(Math.PI * x))); }
  function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }

  // monotone cubic Hermite (PCHIP) through strictly increasing knots, sampled on K+1 uniform steps over [0,T]
  function pchipTable(X, Y, T, K) {
    var m = X.length, h = [], d = [], i;
    for (i = 0; i < m - 1; i++) { h.push(X[i + 1] - X[i]); d.push((Y[i + 1] - Y[i]) / h[i]); }
    var sl = new Array(m);
    sl[0] = d[0]; sl[m - 1] = d[m - 2];
    for (i = 1; i < m - 1; i++) {
      if (d[i - 1] <= 0 || d[i] <= 0) sl[i] = 0;
      else {
        var w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1];

      while (j < m - 2 && x > X[j + 1]) j++;
      var hh = h[j], u = (x - X[j]) / hh, u2 = u * u, u3 = u2 * u;
      out[k] = (2 * u3 - 3 * u2 + 1) * Y[j] + (u3 - 2 * u2 + u) * hh * sl[j] +
        (-2 * u3 + 3 * u2) * Y[j + 1] + (u3 - u2) * hh * sl[j + 1];
    }
    out[0] = 0; out[K] = 1;
    return out;
  }

  // ---------------------------------------------------------------- planRace
  function planRace(names, opts) {
    opts = opts || {};
    var n = names.length;
    if (n < 2) throw new RangeError('planRace: need at least 2 names');
    var rng = opts.rng || createRng(opts.seed);

    var idx = [];
    for (var q = 0; q < n; q++) idx.push(q);
    var order = shuffle(idx, rng);
    var rankOf = new Array(n);
    for (q = 0; q < n; q++) rankOf[order[q]] = q;

    // ---- finish times
    var R = 26000 + Math.floor(rng() * 3001); // v3: 26〜29秒（掛け合い実況の尺）
    var gaps = [40 + Math.floor(rng() * 81)];
    for (q = 1; q < n - 1; q++) gaps.push(220 + Math.floor(rng() * 481));
    var total = 0;
    for (q = 0; q < gaps.length; q++) total += gaps[q];
    var t0 = R - total;
    var finishTime = new Array(n);
    var acc = t0;
    finishTime[order[0]] = t0;
    for (q = 1; q < n; q++) { acc += gaps[q - 1]; finishTime[order[q]] = acc; }
    var a = order[0], b = order[1];
    var t1 = finishTime[b];
    var slowFrom = t0 - 1400 + Math.floor(rng() * 201) - 100;

    var vehicle = pick(VEHICLES, rng);
    var weather = pick(WEATHERS, rng);

    // ---- base curves (monotone, 0 -> 1 exactly at finishTime)
    var K = 600;
    var tables = new Array(n);
    function buildTable(i) {
      var T = finishTime[i];
      var ur = 1 - 2600 / T;
      var amps = [], fr = [], ph = [], ws = 0, j;
      for (j = 0; j < 3; j++) {
        var wt = 0.4 + rng();
        amps.push(wt); ws += wt;
        fr.push(0.8 + rng() * 2.6);
        ph.push(rng() * 2 * Math.PI);
      }
      var tot = 0.30 + 0.10 * rng();
      for (j = 0; j < 3; j++) amps[j] = tot * amps[j] / ws;
      var c;
      if (i === a) c = -(0.15 + 0.04 * rng());        // winner: hold back early, charge late
      else if (i === b) c = 0.08 + 0.05 * rng();      // runner-up: lead early
      else c = (rng() - 0.5) * 0.10;
      function v(u) {
        if (u >= ur) return 1;
        var s = u / ur;
        var g = s < 0.72 ? Math.sin(Math.PI * s / 0.72) : -2.571 * Math.sin(Math.PI * (s - 0.72) / 0.28);
        var tp = s < 0.8 ? 1 : 0.5 * (1 + Math.cos(Math.PI * (s - 0.8) / 0.2));
        var nz = 0;
        for (var k = 0; k < 3; k++) nz += amps[k] * Math.sin(2 * Math.PI * fr[k] * u + ph[k]);

      }
      var P = new Float64Array(K + 1);
      var prev = v(0);
      for (var k = 1; k <= K; k++) {
        var cur = v(k / K);
        P[k] = P[k - 1] + (prev + cur) * 0.5 / K;
        prev = cur;
      }
      var Z = P[K];
      for (k = 0; k <= K; k++) P[k] /= Z;
      P[K] = 1;
      return P;
    }
    var oldTables = new Array(n);
    for (q = 0; q < n; q++) oldTables[q] = buildTable(q);
    function tabAt(tb, T, t) {
      if (t <= 0) return 0;
      if (t >= T) return 1;
      var x = t / T * K, k = Math.floor(x);
      if (k >= K) k = K - 1;
      return tb[k] + (tb[k + 1] - tb[k]) * (x - k);
    }

    // ---- endgame pack: everybody bunches up by finalFrom, stays tangled (lead rotates) until ~3s before the
    //      winner finishes, then the field spreads out in finishing order. Built by re-fitting the base curves.
    var finalFrom = Math.round(t0 - 5000);
    var tG = finalFrom + 2000;
    var tA = finalFrom - 4500;
    var gF = 0.28;
    var sumOld = 0, sumE = 0, j;
    for (q = 0; q < n; q++) { sumOld += tabAt(oldTables[q], finishTime[q], finalFrom); sumE += finishTime[q] - t0; }
    var vf = (1 - sumOld / n) / (5000 + gF * sumE / n);   // pack speed (progress per ms)

    var p0 = [], vi = [];
    for (q = 0; q < n; q++) {
      var Tq = finishTime[q];
      var oa = tabAt(oldTables[q], Tq, tA);
      var pp = Lc - gF * (Tq - t0) * vf;
      pp = Math.max(oa + 0.25 * vf * 4500, Math.min(oa + 2.2 * vf * 4500, pp));
      pp = Math.min(pp, 1 - 0.3 * vf * (Tq - finalFrom));

    var aBehind = n >= 3 && rng() < 0.55;                    // winner sometimes strikes from the back in the last 3s

    var dance = aBehind ? danceBase.slice(1) : danceBase;
    var seq = [], prevC = -1;
    for (j = 0; j < 3; j++) {
      var cand = dance.filter(function (x) { return x !== prevC; });

    var vals = [];
    for (j = 0; j < 4; j++) {

      for (q = 0; q < n; q++) {
        var base = p0[q] + vi[q] * (knotT[j] - finalFrom);
        row.push(j < 3 ? base + (rng() * 2 - 1) * amp : base);

      if (aBehind) row[a] -= vf * (j < 3 ? 250 + 200 * rng() : 200 + 80 * rng());

      for (kk = 0; kk <= kA; kk++) { X.push(T2 * kk / K); Y.push(oldTables[q][kk]); }

      for (j = 0; j < 4; j++) {
        var yv = vals[j][q];
        var minInc = 0.2 * vi[q] * (knotT[j] - pX);
        if (yv < pY + minInc) yv = pY + minInc;
        yv = Math.min(yv, 1 - 0.1 * vi[q] * (T2 - knotT[j]));
        X.push(knotT[j]); Y.push(yv); pX = knotT[j]; pY = yv;

    function bprog(i, t) {

      if (t >= T) return 1;

    // ---- events (additive offsets on the base curve)
    function nm(i) { return names[i] + 'さん'; }

    function makeEffect(type, te, dur, r, r2, par) {
      var e = { type: type, te: te, dur: dur, r: r, r2: r2 };
      var b0, L;
      if (type === 'stumble') {
        var hold = bprog(r, te), after = bprog(r, te + dur);
        var d = after - hold;
        L = Math.max(2 * d, 1e-4);
        e.off = function (i, t) {
          if (t < te) return 0;
          if (t < te + dur) return hold - bprog(i, t);
          return -d * w((bprog(i, t) - after) / L);

        b0 = bprog(r, te + dur); L = 2 * par;
        e.off = function (i, t) {
          if (t < te) return 0;
          if (t < te + dur) return -par * ease((t - te) / dur);
          return -par * w((bprog(i, t) - b0) / L);

        var dr = bprog(r2, te) - bprog(r, te);
        var base = {}; base[r] = bprog(r, te); base[r2] = bprog(r2, te);
        var dl = {}; dl[r] = dr; dl[r2] = -dr;
        L = Math.max(2.2 * Math.abs(dr), 1e-4);
        e.off = function (i, t) {
          if (t < te) return 0;
          return dl[i] * w((bprog(i, t) - base[i]) / L);
        };
      }
      return e;
    }

    function scanEnd(e, limit) {
      var tm;
      for (tm = e.te + e.dur; tm <= limit + 25; tm += 25) {
        if (e.off(e.r, tm) === 0 && (e.r2 < 0 || e.off(e.r2, tm) === 0)) return tm;
      }
      return Infinity;
    }

    var pool = idx.slice(); // every runner (any final rank) can be an event target
    var placed = [];
    var effects = [];

    function tryPlace(type) {
      var hiT = slowFrom - 3000;
      for (var att = 0; att < 400; att++) {
        var te = 3600 + Math.floor(rng() * (hiT - 3600 + 1));
        var sp = att < 150 ? 1400 : 0;
        var ranked = pool.slice().sort(function (x, y) { return bprog(y, te) - bprog(x, te); });
        var r = -1, r2 = -1, par = 0, dur = 0, text;
        if (type === 'stumble') {
          r = pool[Math.floor(rng() * pool.length)];
          dur = 800 + Math.floor(rng() * 401);
          text = pick(TEXTS.stumble, rng).replace('{n}', nm(r));
        } else if (type === 'boost') {
          // uniform over everyone; trailing runners are merely favoured (leaders accepted half the time)
          for (var bt = 0; bt < 4; bt++) {
            r = pool[Math.floor(rng() * pool.length)];
            if (ranked.indexOf(r) >= ranked.length / 2 || rng() < 0.5) break;
          }
          par = 0.06 + rng() * 0.03; dur = 1200;
          text = pick(TEXTS.boost, rng).replace('{n}', nm(r));
        } else if (type === 'reverse') {
          r = pool[Math.floor(rng() * pool.length)];
          par = 0.05 + rng() * 0.03; dur = 700;
          text = pick(TEXTS.reverse, rng).replace('{n}', nm(r));
        } else {
          if (pool.length < 2) return false;
          var bestD = -1;
          for (var m = 0; m < 6; m++) {
            var x = pool[Math.floor(rng() * pool.length)];
            var y = pool[Math.floor(rng() * pool.length)];
            if (x === y) continue;
            var dd = Math.abs(bprog(x, te) - bprog(y, te));
            if (dd > bestD) { bestD = dd; r = x; r2 = y; }
          }
          if (r < 0 || (bestD < 0.03 && att < 250)) continue;
          dur = 500;
          text = pick(TEXTS.swap, rng).replace('{n}', nm(r)).replace('{m}', nm(r2));
        }
        var limit = Math.min(slowFrom, finishTime[r] - 2500);
        if (att < 250 && limit > finalFrom) limit = finalFrom; // prefer events that finish before the pack forms
        if (r2 >= 0) limit = Math.min(limit, finishTime[r2] - 2500);
        if (te + dur > limit) continue;
        var eff = makeEffect(type, te, dur, r, r2, par);
        var end = scanEnd(eff, limit);
        if (end > limit) continue;
        if (freeze && freeze.t >= te - 500 && freeze.t <= end + 300) continue;
        var bad = false;
        for (var p = 0; p < placed.length; p++) {
          var pe = placed[p];
          if (Math.abs(te - pe.t) < sp) { bad = true; break; }
          var shared = pe.runner === r || pe.runner === r2 ||
            (pe.runner2 >= 0 && (pe.runner2 === r || pe.runner2 === r2));
          if (shared && !(te >= pe.end + 200 || pe.t >= end + 200)) { bad = true; break; }
        }
        if (bad) continue;
        var ev = { t: te, dur: dur, type: type, runner: r, text: text, end: end };
        if (r2 >= 0) ev.runner2 = r2;
        placed.push({ t: te, end: end, runner: r, runner2: r2 });
        effects.push(eff);
        events.push(ev);
        return true;
      }
      return false;
    }

    var events = [];
    var want = 2 + Math.floor(rng() * 3);
    var types = shuffle(['stumble', 'boost', 'reverse', 'swap'], rng);
    var ti;
    for (ti = 0; ti < types.length && events.length < want; ti++) tryPlace(types[ti]);
    for (ti = 0; ti < types.length && events.length < 2; ti++) tryPlace(types[ti]);
    events.sort(function (x, y) { return x.t - y.t; });

    // ---- progress
    function finale(i, t) {
      if (t <= t0 - 2000 || t >= t0 - 200) return 0;
      var s = Math.sin(Math.PI * (t - (t0 - 2000)) / 1800);
      s *= s;
      return i === a ? -0.004 * s : 0.012 * s;
    }

    function progress(i, t) {
      var T = finishTime[i];
      if (t <= 0) return 0;
      if (t >= T) return 1;
      var p = bprog(i, t);
      for (var k = 0; k < effects.length; k++) {
        var e = effects[k];
        if (e.r === i || e.r2 === i) p += e.off(i, t);
      }
      if (i === a || i === b) p += finale(i, t);
      return p < 0 ? 0 : (p > 0.999 ? 0.999 : p);
    }

    function leaderAt(t) {
      var best = order[0], bv = progress(best, t);
      for (var k = 1; k < n; k++) {
        var v = progress(order[k], t);
        if (v > bv) { bv = v; best = order[k]; }
      }
      return best;
    }

    // ---- lead changes (sampled every 50ms; A->B->A within 400ms is dropped as flicker; baseline = leaderAt(50))
    function computeLeadChanges() {
      var raw = [], prev = leaderAt(50), tt, L, out = [];
      for (tt = 100; tt <= t0 + 50; tt += 50) {
        L = leaderAt(tt);
        if (L !== prev) { raw.push({ t: tt, leader: L, from: prev }); prev = L; }
      }
      raw.forEach(function (c) {
        var last = out[out.length - 1];
        if (last && last.from === c.leader && c.t - last.t <= 400) out.pop();
        else out.push(c);

      return out.map(function (c) { return { t: c.t, leader: c.leader }; });
    }

    // rank (0 = leader) per runner index; ties broken by finishing order, consistent with leaderAt
    function positionAt(t) {
      var pr = new Array(n), res = new Array(n), i2, j2;
      for (i2 = 0; i2 < n; i2++) pr[i2] = progress(i2, t);
      for (i2 = 0; i2 < n; i2++) {
        var c2 = 0;
        for (j2 = 0; j2 < n; j2++) {
          if (j2 !== i2 && (pr[j2] > pr[i2] || (pr[j2] === pr[i2] && rankOf[j2] < rankOf[i2]))) c2++;
        }
        res[i2] = c2;
      }
      return res;
    }

    // ---- commentary: only the pre-race intro (negative times); in-race lines are generated by the app
    var vname = vehicle.emoji + vehicle.label;
    var commentary = [
      { t: -4500, role: 'ana', text: '本日の天気は' + weather.emoji + weather.label + '！' + weather.forecast + '！' },
      { t: -2300, role: 'kai', text: '本日の乗り物は' + vname + '。' + n + vehicle.counter + 'が一斉にスタートします。' + weather.note }
    ];

    return {
      n: n,
      names: names.slice(),
      order: order,
      rankOf: rankOf,
      finishTime: finishTime,
      raceEnd: R,
      photo: { a: a, b: b, t0: t0, t1: t1 },
      slowFrom: slowFrom,
      events: events,
      freeze: freeze,
      vehicle: vehicle,
      weather: weather,
      sealCode: sealCode(order, names),
      commentary: commentary,
      finalFrom: finalFrom,
      leadChanges: computeLeadChanges(),
      positionAt: positionAt,
      progress: progress,
      baseProgress: bprog,
      leaderAt: leaderAt
    };
  }

  return {
    createRng: createRng,
    shuffle: shuffle,
    VEHICLES: VEHICLES,
    WEATHERS: WEATHERS,
    planRace: planRace,
    PHRASES: PHRASES,
    sealCode: sealCode
  };
})();

if (typeof module !== 'undefined') module.exports = RR.Core;

<script>

/*

var RR = (typeof window !== 'undefined') ? (window.RR = window.RR || {}) : {};

RR.Audio = (function () {

  var master = null;
  var noiseBuf = null;

  var speechOn = true;
  var slow = false;

  // ---- loop state ----
  var loopOn = false;
  var loopTimer = null;
  var loopBus = null;
  var nextStepTime = 0;
  var stepIdx = 0;
  var nextBeatTime = 0;
  var tension = 0;
  var ambBus = null, heartBus = null, ambNodes = [];

  // ---- speech state ----

  var voicesLoaded = false;
  var speaking = false;      // 実発話が進行中（またはキュー済み）
