<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月例発表会カップ - 発表順決めレース</title>
<style>
:root{
  --bg:#0a0f24; --bg2:#141c3d; --fg:#ffffff; --dim:#b9c4ee;
  --gold:#ffd23f; --cyan:#3be0ff; --red:#ff4d6d; --green:#5dff9c;
  --ana:#ffb347; --kai:#7fe3ff;
  font-family:"Yu Gothic UI","Meiryo","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--fg)}
body{background:radial-gradient(ellipse at 50% 0%,#1f2a63 0%,var(--bg) 65%)}
button,input,textarea{font-family:inherit}
.hidden{display:none !important}
[hidden]{display:none !important}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:flex;flex-direction:column}

/* 右上コントロール */
#controls{position:fixed;top:.5vh;right:1vw;z-index:100;display:flex;gap:8px}
#controls button{background:#000a;color:var(--fg);border:2px solid #fff8;border-radius:999px;padding:3px 12px;font-size:clamp(14px,1.7vh,22px);font-weight:700;cursor:pointer}
#controls button.off{opacity:.6;text-decoration:line-through}
#controls button:hover{border-color:var(--gold)}
#shareNote{position:fixed;top:calc(1vh + 52px);right:1vw;z-index:100;max-width:34vw;background:#000d;border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:clamp(14px,1.8vh,22px);line-height:1.4}

/* ロゴ */
.logo{text-align:center;padding:3vh 2vw 1vh;flex:none}
.logoTop{letter-spacing:.35em;color:var(--gold);font-weight:800;font-size:clamp(12px,1.8vh,22px)}
.logoMain{display:inline-block;margin-top:.6vh;padding:.4vh 2vw;font-size:clamp(34px,7vh,92px);font-weight:900;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff 0%,#ffe27a 45%,#ff9f1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .5vh 0 #7a3b00) drop-shadow(0 0 1.6vh #ff9f1c88);
  border-top:.6vh solid var(--gold);border-bottom:.6vh solid var(--gold)}
.trophy{-webkit-text-fill-color:initial;margin-right:.4em}
.logoSub{margin-top:.6vh;font-size:clamp(16px,2.6vh,34px);font-weight:800;color:var(--cyan);letter-spacing:.3em}

/* 準備 */
.setupBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.2vh;width:min(900px,92vw);margin:0 auto;padding-bottom:2.5vh}
.fieldLabel{font-size:clamp(16px,2.4vh,30px);font-weight:800;color:var(--gold)}
#names{flex:1;min-height:0;resize:none;background:#05081a;color:var(--fg);border:3px solid var(--cyan);border-radius:14px;padding:1.2vh 1.2vw;font-size:clamp(20px,3.2vh,40px);line-height:1.35;font-weight:700}
#names:focus{outline:none;border-color:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:1vh 2vw;align-items:center;font-size:clamp(16px,2.4vh,30px);font-weight:700}
.opts input[type=text],.opts input[type=number]{background:#05081a;color:var(--fg);border:2px solid var(--cyan);border-radius:8px;padding:.3vh .6vw;font-size:inherit;font-weight:800;width:5.5em;text-align:center}
.opts input[type=number]{width:4.2em}
.opts .chk input{width:1.1em;height:1.1em;vertical-align:middle}
.msg{min-height:2.4em;font-size:clamp(16px,2.4vh,30px);font-weight:800;color:var(--red)}
.msg.ok{color:var(--green)}
.bigBtn{flex:none;background:linear-gradient(180deg,#ffe27a,#ff9f1c);color:#2a1300;border:0;border-radius:16px;padding:1.4vh 2vw;font-size:clamp(24px,4.2vh,56px);font-weight:900;cursor:pointer;box-shadow:0 .8vh 0 #8a4a00}
.bigBtn:hover{filter:brightness(1.08)}
.bigBtn:active{transform:translateY(.5vh);box-shadow:0 .3vh 0 #8a4a00}
.bigBtn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}

/* レース */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#telop{position:absolute;left:0;right:24vw;top:.7vh;text-align:center;z-index:20;pointer-events:none}
#telop span{display:inline-block;max-width:74vw;padding:.4vh 1.6vw;background:#000e;border-top:.5vh solid var(--gold);border-bottom:.5vh solid var(--gold);
  font-size:clamp(32px,5vh,100px);font-weight:900;line-height:1.2;text-shadow:0 0 1.2vh #000;animation:pop .3s ease-out}
#telop.big span{color:var(--gold);font-size:clamp(34px,5.4vh,110px)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#telop.lc span{font-size:clamp(28px,4.2vh,84px);color:var(--cyan);border-color:var(--cyan);animation:pop .2s ease-out}
#spurt{position:absolute;left:0;right:0;top:15vh;z-index:22;pointer-events:none;overflow:hidden;
  background:repeating-linear-gradient(115deg,#c1121fe6 0 28px,#8a0a14e6 28px 56px);border-top:.6vh solid #fff;border-bottom:.6vh solid #fff;
  animation:spurtIn .3s cubic-bezier(.2,1.3,.4,1) both,throb .5s ease-in-out .3s 2,spurtOut .35s ease-in 1.15s forwards}
@keyframes spurtOut{to{transform:translateX(110%) skewX(-12deg);opacity:.2}}
#spurt span{display:block;text-align:center;padding:.6vh 0;font-size:clamp(44px,8vh,150px);font-weight:900;letter-spacing:.12em;color:#fff;text-shadow:0 .6vh 0 #000,0 0 3vh #ffd23f}
@keyframes spurtIn{from{transform:translateX(-110%) skewX(-12deg)}to{transform:translateX(0) skewX(0)}}
@keyframes throb{50%{filter:brightness(1.35)}}
/* v4: 字幕は名前札より大きく。外枠だけ色付き、本文は白（縮小表示でも読める） */
#sub{position:absolute;left:0;right:0;bottom:1vh;text-align:center;z-index:32;pointer-events:none}
#sub > span{display:inline-block;max-width:96vw;padding:.5vh 1.6vw;background:#000e;border-radius:14px;font-size:clamp(34px,4.9vh,100px);font-weight:900;line-height:1.25;border:.45vh solid currentColor}
#sub.ana > span{color:var(--ana)} #sub.kai > span{color:var(--kai)}
#sub b{font-size:.7em;margin-right:.6em;padding:0 .5em;border-radius:6px;background:currentColor}
#sub b i{font-style:normal;color:#000}
#sub .tx{color:#fff}
#freezeMsg{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;background:#808080aa}
#freezeMsg .fz{font-size:clamp(48px,9vh,140px);font-weight:900;color:#fff;text-shadow:0 0 2vh #000;letter-spacing:.1em}
#freezeMsg .ring{width:10vh;height:10vh;border:1.2vh solid #fff5;border-top-color:#fff;border-radius:50%;margin-top:3vh;animation:spin 1s linear infinite}
#freezeMsg.liar{background:transparent}
#freezeMsg.liar .fz{color:var(--gold);animation:pop .3s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
#count{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(160px,38vh,520px);font-weight:900;color:var(--gold);
  text-shadow:0 0 3vh #000,0 0 8vh #ff9f1c}
#count span{animation:pop .4s ease-out}
/* 勝者カットイン（斜めの帯が横切って止まる） */
#cutin{position:absolute;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#0008;animation:ciFade 2.3s ease-out both}
#cutin .ciBand{display:flex;align-items:center;gap:3vw;width:120vw;padding:2.5vh 0;justify-content:center;transform:rotate(-6deg);
  background:repeating-linear-gradient(115deg,#ffd23f 0 40px,#ffb300 40px 80px);border-top:1vh solid #fff;border-bottom:1vh solid #fff;box-shadow:0 0 6vh #000;
  animation:ciIn .45s cubic-bezier(.2,1.4,.4,1) both}
#cutin .ciFace{font-size:clamp(90px,20vh,260px);line-height:.9;text-align:center;animation:ciPop .6s .25s ease-out both}
#cutin .ciText{text-align:left;color:#2a1300}
#cutin .ciRank{font-size:clamp(36px,7vh,110px);font-weight:900;letter-spacing:.1em}
#cutin .ciName{font-size:clamp(56px,13vh,190px);font-weight:900;line-height:1.05;color:#fff;text-shadow:0 .7vh 0 #7a3b00,0 0 2vh #000;max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cutin .ciSub{font-size:clamp(28px,5vh,80px);font-weight:900;color:#b3001b}
@keyframes ciIn{from{transform:translateX(-110vw) rotate(-6deg)}to{transform:translateX(0) rotate(-6deg)}}
@keyframes ciPop{0%{transform:scale(.2) rotate(-30deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes ciFade{0%{opacity:1}85%{opacity:1}100%{opacity:0}}
#skipHint{position:absolute;left:0;right:0;bottom:1.5vh;text-align:center;z-index:50;color:var(--dim);font-size:clamp(14px,2vh,26px);pointer-events:none}

/* レース前ボード */
#intro{position:absolute;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:#050a1ccc;cursor:pointer}
.board{width:min(1100px,90vw);text-align:center;padding:3vh 3vw;border-radius:28px;border:.8vh solid var(--gold);background:linear-gradient(180deg,#1b2a73,#0b1236);box-shadow:0 0 6vh #000;animation:pop .35s ease-out}
.bTitle{font-size:clamp(28px,5vh,68px);font-weight:900;color:var(--gold);letter-spacing:.08em}
.bBig{font-size:clamp(120px,26vh,360px);line-height:1.1}
.bLabel{font-size:clamp(48px,9vh,130px);font-weight:900}
.bText{margin-top:1vh;font-size:clamp(28px,5vh,68px);font-weight:800;color:var(--cyan);line-height:1.3}
.board.envb .bBig{font-size:clamp(100px,20vh,280px)}
.seal{display:inline-block;margin:1vh 0;padding:.6vh 2vw;border-radius:999px;background:radial-gradient(circle at 35% 30%,#ff7a8a,#b0102b);border:.6vh solid #7a0016;font-size:clamp(40px,8vh,110px);font-weight:900;letter-spacing:.12em;font-family:Consolas,"Courier New",monospace}

/* 写真判定フィルム */
#film{position:absolute;left:7vw;top:13vh;width:52vw;z-index:25;pointer-events:none;animation:pop .3s ease-out}
.filmStrip{background:#050505;padding:3.4vh 1.2vw;border-radius:6px;
  background-image:repeating-linear-gradient(90deg,transparent 0 14px,#d8d0b8 14px 28px);
  background-size:100% 1.6vh;background-repeat:no-repeat;background-position:0 .7vh;position:relative;border:2px solid #222}
.filmStrip::after{content:"";position:absolute;left:0;right:0;bottom:.7vh;height:1.6vh;background-image:repeating-linear-gradient(90deg,transparent 0 14px,#d8d0b8 14px 28px)}
.filmWin{position:relative;border:3px solid #111;line-height:0}
#filmCv{width:100%;height:auto;display:block;filter:sepia(.85) grayscale(.55) contrast(1.15) brightness(.95)}
.filmTag{position:absolute;left:.6vw;top:.6vh;line-height:1.2;font-size:clamp(14px,2vh,28px);font-weight:900;color:#f3e6bd;background:#000a;padding:.2vh .6vw;letter-spacing:.2em}
.filmInfo{display:flex;align-items:center;gap:1.4vw;margin-top:1vh;background:#000d;border-radius:12px;padding:1vh 1.2vw;min-height:9vh}
#lamps{display:flex;gap:1vw;flex:none}
#lamps i{display:block;width:5vh;height:5vh;border-radius:50%;background:#3a1010;border:.4vh solid #666;transition:none}
#lamps i.on{background:radial-gradient(circle at 35% 30%,#fff,#ffd23f 40%,#ff7a00);box-shadow:0 0 3vh #ffb300;border-color:#fff}
#lamps i.final{background:radial-gradient(circle at 35% 30%,#fff,#5dff9c 40%,#00b35a);box-shadow:0 0 4vh #5dff9c}
#verdict{white-space:nowrap;font-size:clamp(24px,3.8vh,60px);font-weight:900;color:var(--gold);line-height:1.2}

/* 結果 */
#result{padding:1.5vh 2vw 1.5vh;gap:1vh}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
#confetti i{position:absolute;top:-8vh;display:block;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.resHead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:2vw;padding-right:0;position:relative;z-index:6;padding-top:3.4vh}
.resTitle{font-size:clamp(28px,5vh,72px);font-weight:900;color:var(--gold)}
.env{background:#2a1f10;color:#fff;border:.4vh solid var(--gold);border-radius:14px;padding:.8vh 1.4vw;font-size:clamp(18px,2.8vh,38px);font-weight:800;cursor:pointer}
.env b{font-family:Consolas,"Courier New",monospace;letter-spacing:.1em;color:var(--gold);font-size:1.15em}
.env.open{background:#16361f;border-color:var(--green);animation:pop .4s ease-out}
#podium{flex:none;height:31vh;display:flex;justify-content:center;align-items:flex-end;gap:1.4vw;position:relative;z-index:6}
.pod{display:flex;flex-direction:column;align-items:center;width:26vw;max-width:420px}
.pod .who{font-size:clamp(26px,4.4vh,64px);font-weight:900;text-align:center;line-height:1.15;padding-bottom:.6vh;max-width:100%}
.pod .whoLk{font-size:.75em;line-height:1.1;white-space:nowrap}
.pod .whoNm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pod .block{width:100%;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:clamp(30px,5.6vh,80px);font-weight:900;color:#1a1000;padding-top:.4vh}
.pod.p1 .block{height:15vh;background:linear-gradient(180deg,#fff0a0,#e0a800)}
.pod.p2 .block{height:10.5vh;background:linear-gradient(180deg,#f2f5ff,#9aa6c4)}
.pod.p3 .block{height:7vh;background:linear-gradient(180deg,#ffd0a0,#c0702a)}
.pod.p1 .who{color:var(--gold);font-size:clamp(30px,5.2vh,76px)}
#orderList{flex:1;min-height:0;margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr;grid-auto-flow:column;position:relative;z-index:6;
  gap:.5vh 2vw;align-content:start;padding-top:.6vh}
#orderList li{display:flex;align-items:center;gap:1.2vw;background:#ffffff14;border-left:.8vh solid var(--cyan);border-radius:8px;padding:0 1vw;
  font-size:clamp(22px,3.5vh,50px);font-weight:900;white-space:nowrap;overflow:hidden;animation:pop .35s ease-out backwards}
.vh{display:inline-block;margin-right:.15em}
.lk{display:inline-block;margin-right:.3em;font-size:.85em;white-space:nowrap}
#orderList .rk{color:var(--gold);min-width:1.6em;text-align:right}
#orderList .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
#orderList .tm{color:var(--dim);font-size:.75em;font-weight:800}
#orderList.two{grid-template-columns:1fr 1fr}
.resBtns{flex:none;display:flex;gap:1.4vw;justify-content:center;position:relative;z-index:6;padding-top:.5vh}
.resBtns button{background:#1e2b66;color:#fff;border:.4vh solid #fff8;border-radius:14px;padding:1vh 1.6vw;font-size:clamp(18px,2.8vh,38px);font-weight:900;cursor:pointer}
.resBtns button.primary{background:linear-gradient(180deg,#ffe27a,#ff9f1c);color:#2a1300;border-color:#8a4a00}
.resBtns button:hover{filter:brightness(1.15)}

</style>
</head>
<body>

<div id="controls">
  <button id="btnSound" type="button" title="音のオン/オフ">🔊 音 ON</button>
  <button id="btnSpeech" type="button" title="実況の読み上げ">🗣 読み上げ ON</button>
  <button id="btnShare" type="button" title="Teams共有の注意">ℹ 音の共有</button>
</div>
<div id="shareNote" hidden>Teamsで音を共有するには『コンピューターのサウンドを含める』をオン</div>

<!-- 準備 -->
<section id="setup" class="screen active">
  <div class="logo">
    <div class="logoTop">★ MONTHLY PRESENTATION CUP ★</div>
    <div class="logoMain"><span class="trophy">🏆</span>月例発表会カップ</div>
    <div class="logoSub">発表順決めレース</div>
  </div>
  <div class="setupBody">
    <label class="fieldLabel" for="names">出走メンバー（1行に1人・貼り付けOK）</label>
    <textarea id="names" spellcheck="false" autocomplete="off"></textarea>
    <div class="opts">
      <label>発表開始時刻 <input id="optStart" type="text" value="13:00" size="5" inputmode="numeric"></label>
      <label>1人あたり <input id="optMin" type="number" value="8" min="1" max="120"> 分</label>
      <label class="chk"><input id="optSpeech" type="checkbox" checked> 実況を読み上げる</label>
    </div>
    <div id="setupMsg" class="msg"></div>
    <button id="btnStart" type="button" class="bigBtn">🏁 スタート（スペース）</button>
  </div>
</section>

<!-- レース -->
<section id="race" class="screen">
  <canvas id="cv"></canvas>
  <div id="telop" class="hidden"></div>
  <div id="spurt" class="hidden"></div>
  <div id="sub" class="hidden"></div>
  <div id="freezeMsg" class="hidden"></div>
  <div id="count" class="hidden"></div>
  <div id="intro" class="hidden"></div>
  <div id="film" class="hidden">
    <div class="filmStrip">
      <div class="filmWin"><canvas id="filmCv"></canvas><div class="filmTag">PHOTO FINISH</div></div>
    </div>
    <div class="filmInfo">
      <div id="lamps"><i></i><i></i><i></i></div>
      <div id="verdict"></div>
    </div>
  </div>
  <div id="cutin" class="hidden"></div>
  <div id="skipHint" class="hidden">スペース / クリックでスキップ</div>
</section>

<!-- 結果 -->
<section id="result" class="screen">
  <div id="confetti"></div>
  <div class="resHead">
    <div class="resTitle">🏆 発表順が決まりました！</div>
    <button id="envelope" type="button" class="env"></button>
  </div>
  <div id="podium"></div>
  <ol id="orderList"></ol>
  <div class="resBtns">
    <button id="btnCopy" type="button">📋 タイムテーブルをコピー</button>
    <button id="btnAgain" type="button" class="primary">🔁 もう一度</button>
    <button id="btnChange" type="button">✏ メンバー変更</button>
  </div>
</section>

<script>
/* core.js */
var RR = (typeof window !== 'undefined') ? (window.RR = window.RR || {}) : {};

RR.Core = (function () {
  'use strict';

  // ---------------------------------------------------------------- RNG
  function randomSeed32() {
    try {
      if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
        return crypto.getRandomValues(new Uint32Array(1))[0] >>> 0;
      }
    } catch (e) { /* fallthrough */ }
    try {
      if (typeof require === 'function') {
        return require('crypto').randomInt(0, 4294967296) >>> 0;
      }
    } catch (e2) { /* fallthrough */ }
    return Math.floor(Math.random() * 4294967296) >>> 0;
  }

  function createRng(seed) {
    var s;
    if (seed === undefined || seed === null) s = randomSeed32();
    else if (typeof seed === 'number') s = seed >>> 0;
    else s = fnv1a(String(seed)) >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function fnv1a(str, seed) {
    var h = (seed === undefined ? 0x811c9dc5 : seed) >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function fmix(h) {
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return h >>> 0;
  }

  var SEAL_ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';

  function sealCode(order, names) {
    var s = order.map(function (i) { return names[i]; }).join('\u0001') + '|' + order.join(',');
    var h1 = fmix(fnv1a(s));
    var h2 = fmix(fnv1a(s + '#seal', 0x2545F491));
    var c = [];
    for (var j = 0; j < 6; j++) c.push(SEAL_ALPHABET.charAt((h1 >>> (5 * j)) & 31));
    c.push(SEAL_ALPHABET.charAt(h2 & 31));
    return c[0] + c[1] + '-' + c[2] + c[3] + c[4] + '-' + c[5] + c[6];
  }

  // ---------------------------------------------------------------- data
  var VEHICLES = [
    { id: 'horse',   emoji: '🐎', label: '馬',                 counter: '頭' },
    { id: 'snail',   emoji: '🐌', label: 'カタツムリ',         counter: '匹' },
    { id: 'turtle',  emoji: '🐢', label: 'カメ',               counter: '匹' },
    { id: 'duck',    emoji: '🦆', label: 'アヒル',             counter: '羽' },

  // 走りの調整値（v4.2）。startMs=スタートの加速にかかる時間、minEarly=スパート前の速さの下限（その人の平均の速さに対する比。遅すぎて止まって見えないように）

  // ---------------------------------------------------------------- planRace

    var finishTime = new Array(n);

    var a = order[0], b = order[1];
    var t1 = finishTime[b];
    var slowFrom = t0 - 1400 + Math.floor(rng() * 201) - 100;

    var vehicle = pick(VEHICLES, rng);
    var weather = pick(WEATHERS, rng);

    // ---- base curves (monotone, 0 -> 1 exactly at finishTime)
    // v4.2: 理由なく遅くならない走り。各自の速さは「スタートの加速」と「スパート（最大2回）」でだけ変わり、一度も下がらない。
    //   遅くなる・止まる・戻るのはイベント（転倒・逆走など）のときだけ。
    //   中盤のばらけは「最初から速い人（逃げ）」と「最初はゆっくりで後からスパートする人（差し・追い込み）」の差で作る。
    //   条件（最後の2秒は1着・2着が並んで先頭、2着が一度前に出る など）を満たすまで、スパートの位置と強さを引き直す。
    var K = 600;
    var tables = new Array(n);
    var finalFrom = Math.round(t0 - 5000);

    function sstep(x) { return x <= 0 ? 0 : (x >= 1 ? 1 : x * x * (3 - 2 * x)); }

      }

      for (j2 = 0; j2 <= K; j2++) tb[j2] = F[j2 * 2] / F[NI];

      return { tb: tb, early: T / F[NI] };   // early = 加速後・スパート前の速さ（その人の平均の速さに対する比）
    }
    function drawParams(q) {
      var T = finishTime[q], P = {};
      if (q === a) {

        var closer = n === 2 ? rng() < 0.7 : rng() < 0.8;
        P.k1 = closer ? uni(0.5, 1.5) : uni(0, 0.15); P.s1 = uni(0.45, 0.65) * T; P.d1 = uni(2500, 6000);

      } else if (q === b) {

        P.k1 = uni(0, 0.8); P.s1 = uni(0.3, 0.65) * T; P.d1 = uni(2500, 6000);

        var st = rng();

        else if (st < 0.55) { P.k1 = uni(0.15, 0.4); P.s1 = uni(0.3, 0.55) * T; }
        else if (st < 0.75) { P.k1 = uni(0.5, 1.0); P.s1 = uni(0.45, 0.6) * T; }

    }
    function tabAt(tb, T, t) {

      var at = function (q2, t) { return tabAt(tbs[q2], finishTime[q2], t); };

    // ---- progress
    function progress(i, t) {

      if (t <= 0) return 0;
      if (t >= T) return 1;
      var p = bprog(i, t);
      for (var k = 0; k < effects.length; k++) {
        var e = effects[k];
        if (e.r === i || e.r2 === i) p += e.off(i, t);
      }
      return p < 0 ? 0 : (p > 0.999 ? 0.999 : p);
    }

    function leaderAt(t) {
      var best = order[0], bv = progress(best, t);
      for (var k = 1; k < n; k++) {
        var v = progress(order[k], t);
        if (v > bv) { bv = v; best = order[k]; }
      }
      return best;
    }

    // ---- lead changes (sampled every 50ms; A->B->A within 400ms is dropped as flicker; baseline = leaderAt(50))

    function positionAt(t) {
      var pr = new Array(n), res = new Array(n), i2, j2;

      for (i2 = 0; i2 < n; i2++) {

      ['D5', 3.5,  0.5, 'G3', 'M'],
      ['G5', 4,    1.0, 'C4', 'M'],
      ['E5', 5,    0.5, 'A3', 'm'],
      ['A5', 5.5,  0.5, 'F3', 'M'],
      ['G5', 6,    1.0, 'G3', 'M'],
      ['C5', 7.5,  0.5, 'C4', 'M'],

      var st = WEATHER_STYLE[wid];
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, st.skyA);
      g.addColorStop(1, st.skyB);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      var r = Math.max(26, L.top * 0.45);
      if (wid === 'sunny' || wid === 'rainbow' || wid === 'wind') {
        drawSun(W * 0.76, L.top * 0.5, r, t, '#ffd93b');
      } else if (wid === 'sunset') {
        drawSun(W * 0.82, L.top + L.laneH * 0.4, r * 1.9, t, '#ff5a2a');
      } else if (wid === 'night') {
        for (var k = 0; k < 14; k++) {
          var sx = hash(k, 1) * W, sy = hash(k, 2) * H;
          var tw = 0.5 + 0.5 * Math.sin(t * 0.002 + k * 3.1);
          ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.55 * tw).toFixed(2) + ')';
          ctx.beginPath(); ctx.arc(sx, sy, 2 + hash(k, 3) * 2.5, 0, 6.283); ctx.fill();
        }
        // 月
        var mx = W * 0.76, my = L.top * 0.5;
        ctx.fillStyle = '#fff6c8';
        ctx.beginPath(); ctx.arc(mx, my, r, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#0d1536';
        ctx.beginPath(); ctx.arc(mx + r * 0.45, my - r * 0.2, r * 0.9, 0, 6.283); ctx.fill();
      } else if (wid === 'cloudy' || wid === 'rain' || wid === 'thunder' || wid === 'storm' || wid === 'snow') {
        var dark = (wid === 'thunder' || wid === 'storm') ? 'rgba(30,34,50,0.85)' : (wid === 'rain' ? 'rgba(80,92,110,0.85)' : 'rgba(255,255,255,0.9)');
        for (var c = 0; c < 4; c++) {
          var cx = ((hash(c, 5) * W + t * 0.012 * (1 + c * 0.3)) % (W + 400)) - 200;
          cloud(cx, L.top * (0.3 + 0.2 * hash(c, 6)), L.top * (0.9 + 0.5 * hash(c, 7)), dark);
        }
      }
      if (wid === 'rainbow') {
        var bx = W * 0.5, by = H * 0.9, br = H * 0.78;
        var cols = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];
        ctx.lineWidth = 12;
        for (var q = 0; q < cols.length; q++) {
          ctx.strokeStyle = cols[q];
          ctx.globalAlpha = 0.55;
          ctx.beginPath(); ctx.arc(bx, by, br - q * 12, Math.PI, 0); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }

    function cloud(x, y, s, col) {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(x, y, s * 0.35, 0, 6.283);
      ctx.arc(x + s * 0.35, y - s * 0.12, s * 0.42, 0, 6.283);
      ctx.arc(x + s * 0.75, y, s * 0.32, 0, 6.283);
      ctx.rect(x, y, s * 0.75, s * 0.32);
      ctx.fill();
    }

    function drawSun(x, y, r, t, col) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * 0.0003);
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(4, r * 0.18);
      ctx.lineCap = 'round';
      for (var k = 0; k < 12; k++) {
        var a = k / 12 * 6.283;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 1.3, Math.sin(a) * r * 1.3);
        ctx.lineTo(Math.cos(a) * r * 1.75, Math.sin(a) * r * 1.75);
        ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.45, 0, 6.283); ctx.fill();
    }

    // ---------- コース ----------
    function drawTrack(wid, t) {
      var st = WEATHER_STYLE[wid];
      var n = L.n, lh = L.laneH, x0 = L.x0, x1 = L.x1;
      var i, y;
      for (i = 0; i < n; i++) {
        y = L.top + i * lh;
        var col = LANE_COLORS[i % LANE_COLORS.length];
        ctx.fillStyle = mix(col, st.mix, st.amt + (i % 2 ? 0.04 : -0.02));
        ctx.fillRect(0, y, W, lh);
      }
      // レーン境界線
      ctx.strokeStyle = st.line;
      ctx.lineWidth = 2;
      for (i = 0; i <= n; i++) {
        y = L.top + i * lh;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      // 距離マーカー
      var marks = [0.25, 0.5, 0.75];
      var mfs = Math.max(20, Math.min(30, L.top * 0.34));
      ctx.font = '800 ' + mfs + 'px ' + TEXT_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (var m = 0; m < marks.length; m++) {
        var mx = x0 + L.emoji * 0.5 + marks[m] * (x1 - x0 - L.emoji) ;
        ctx.setLineDash([10, 10]);
        ctx.strokeStyle = st.line;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(mx, L.top); ctx.lineTo(mx, H - L.bot); ctx.stroke();
        ctx.setLineDash([]);
        var label = Math.round(marks[m] * 100) + '%';
        ctx.fillStyle = st.ink;
        ctx.globalAlpha = 0.85;
        ctx.fillText(label, mx, L.top - mfs * 0.7);
        ctx.globalAlpha = 1;
      }
      // スタートゲート
      var gy0 = L.top, gy1 = L.top + n * lh;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x0 - 5, gy0, 10, gy1 - gy0);
      ctx.fillStyle = '#d32f2f';
      for (i = 0; i < n * 2; i++) {
        if (i % 2 === 0) ctx.fillRect(x0 - 5, gy0 + i * lh / 2, 10, lh / 2);
      }
      ctx.fillStyle = st.ink;
      ctx.font = '900 ' + mfs + 'px ' + TEXT_FONT;
      ctx.fillText('START', x0, L.top - mfs * 0.7);
      // ゴールのチェッカー
      var cs = L.cs;
      var cols = 1;
      var gx = x1 + 2;
      var rows = Math.ceil((gy1 - gy0) / cs);
      for (var rr = 0; rr < rows; rr++) {
        for (var cc = 0; cc < cols * 2; cc++) {
          ctx.fillStyle = ((rr + cc) % 2 === 0) ? '#111' : '#fff';
          var ch = Math.min(cs, gy1 - (gy0 + rr * cs));
          ctx.fillRect(gx + cc * cs / 1, gy0 + rr * cs, cs, ch);
        }
      }
      ctx.fillStyle = st.ink;
      ctx.font = '900 ' + mfs + 'px ' + TEXT_FONT;
      ctx.textAlign = 'right';
      ctx.fillText('GOAL', W - 6, L.top - mfs * 0.7);
      ctx.textAlign = 'center';

      // レーン番号
      for (i = 0; i < n; i++) {
        y = L.top + i * lh;
        var c2 = LANE_COLORS[i % LANE_COLORS.length];
        ctx.fillStyle = c2;
        ctx.fillRect(0, y + 2, L.labelW, lh - 4);
        var nf = Math.min(lh * 0.72, 56);
        ctx.font = '900 ' + nf + 'px ' + TEXT_FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        outlined(ctx, String(i + 1), L.labelW / 2, y + lh / 2 + nf * 0.04, nf, '#fff', 'rgba(0,0,0,0.55)', Math.max(3, nf * 0.14));
      }
      ctx.textAlign = 'left';
    }

    // ---------- 走者 ----------
    function activeEvents(i, t) {
      var res = { stumble: null, boost: null, reverse: null, swap: null };
      var ev = plan.events || [];
      for (var k = 0; k < ev.length; k++) {
        var e = ev[k];
        if (e.type === 'swap') {
          if ((e.runner === i || e.runner2 === i) && t >= e.t - 100 && t <= e.t + 1600) res.swap = e;
        } else if (e.runner === i && t >= e.t && t <= e.t + (e.dur || 1000)) {
          res[e.type] = e;
        }
      }
      return res;
    }

    // いまの順位（先頭=0）。plan.positionAt があれば使い、無ければ progress から計算
    function ranksAt(t) {
      var n = L.n, i, j, out = [];
      if (typeof plan.positionAt === 'function') {
        try {
          var a = plan.positionAt(t);
          if (a && a.length >= n) return a;
        } catch (e) { /* fallthrough */ }
      }
      var ps = [];
      for (i = 0; i < n; i++) ps.push(plan.progress(i, t));
      for (i = 0; i < n; i++) {
        var r = 0;
        for (j = 0; j < n; j++) if (ps[j] > ps[i] || (ps[j] === ps[i] && j < i)) r++;
        out.push(r);
      }
      return out;
    }

    // 状況 → 表情の種類
    function faceKind(i, t, ev, rk, tension, hidden) {
      var n = L.n;
      var ft = plan.finishTime[i];
      if (t >= ft) {
        if (hidden) return 'nerv';          // 写真判定の発表待ち（1着・2着とも同じ顔）
        var rank = plan.rankOf[i];
        return rank === 0 ? 'win' : (rank <= 2 ? 'podium' : 'other');
      }
      if (ev.stumble) return 'stumble';
      if (ev.swap) return 'swap';
      if (ev.reverse) return 'reverse';
      if (ev.boost) return 'boost';
      if (t <= 0) return 'mid';
      if (rk === 0) return 'lead';
      if (rk <= Math.max(1, Math.round(n * 0.3) - 1)) return 'up';
      if (n >= 3 && rk >= Math.ceil(n * 0.7)) return 'back';
      return tension > 0.6 ? 'nerv' : 'mid';
    }

    function drawStar(x, y, r, rot) {
      ctx.beginPath();
      for (var k = 0; k < 10; k++) {
        var rr = k % 2 ? r * 0.45 : r;
        var a = rot + k * Math.PI / 5 - Math.PI / 2;
        if (k === 0) ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        else ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fill();
    }

    // 頭の飾り（原点=頭のてっぺん、上向きに描く）
    function drawHat(look, hs, t) {
      if (look.hat === 'horn') {
        var g = ctx.createLinearGradient(0, 0, 0, -hs * 1.1);
        g.addColorStop(0, '#fff6c8'); g.addColorStop(1, '#ffb300');
        ctx.fillStyle = g;
        ctx.strokeStyle = '#7a4a00';
        ctx.lineWidth = Math.max(2, hs * 0.07);
        ctx.beginPath();
        ctx.moveTo(-hs * 0.28, 0); ctx.lineTo(hs * 0.28, 0); ctx.lineTo(0, -hs * 1.1);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-hs * 0.2, -hs * 0.35); ctx.lineTo(hs * 0.2, -hs * 0.45);
        ctx.moveTo(-hs * 0.13, -hs * 0.68); ctx.lineTo(hs * 0.13, -hs * 0.74);
        ctx.stroke();
      } else if (look.hat === 'prop') {
        ctx.strokeStyle = '#37474f';
        ctx.lineWidth = Math.max(2, hs * 0.1);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -hs * 0.4); ctx.stroke();
        ctx.save();
        ctx.translate(0, -hs * 0.42);
        ctx.scale(Math.cos(t * 0.012 + look.phase), 1);
        ctx.fillStyle = look.tint;
        ctx.strokeStyle = '#102030';
        ctx.lineWidth = Math.max(2, hs * 0.06);
        ctx.beginPath(); ctx.ellipse(-hs * 0.4, 0, hs * 0.42, hs * 0.12, 0, 0, 6.283); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(hs * 0.4, 0, hs * 0.42, hs * 0.12, 0, 0, 6.283); ctx.fill(); ctx.stroke();
        ctx.restore();
      } else {
        drawEmoji(look.hat, 0, -hs * 0.42, hs * 1.05);
      }
    }

    // 名札の後ろに流れる軌跡（少数・大きめ）。名札より後ろに描く
    function drawTrail(i, t, px, yc, size, look) {
      var cnt = L.n <= 8 ? 3 : 2;
      var lh = L.laneH;
      for (var j = 0; j < cnt; j++) {
        var ph = frac(t / 1700 + j / cnt + look.phase / 6.283);
        var x = px + size * 0.1 - ph * size * 3.4;
        if (x < L.labelW + size * 0.4) continue;
        var y = yc + Math.sin(ph * 9 + j * 2 + i) * lh * 0.16 - ph * lh * 0.12;
        var a = Math.sin(ph * Math.PI);
        if (a < 0.05) continue;
        var s = size * (0.5 + 0.22 * hash(i * 7 + j, 4)) * (1 - 0.25 * ph);
        ctx.globalAlpha = Math.min(1, a * 1.3);
        pc++;
        if (look.trailCh) {
          ctx.save();
          ctx.translate(x, y);
          if (look.trail === 'star' || look.trail === 'spark' || look.trail === 'leaf') ctx.rotate(ph * 4 + j);
          drawEmoji(look.trailCh, 0, 0, s);
          ctx.restore();
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.strokeStyle = look.tint;
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(x, y, s * 0.36, 0, 6.283); ctx.fill(); ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.beginPath(); ctx.arc(x - s * 0.12, y - s * 0.12, s * 0.09, 0, 6.283); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }

    // rv = 写真判定の発表時刻（レース時計）。-1 なら発表前：1着・2着のバッジ・表情・喜びのポーズを伏せる。undefined なら伏せない
    function drawRunner(i, t, rk, tension, rv) {
      var lh = L.laneH;
      var yc = L.top + i * lh + lh / 2;
      var p = clamp(plan.progress(i, t), 0, 1);
      var look = looks[i];
      var base = L.emoji;
      var size = base * (0.96 + (look.size - 1) * 0.6);
      var plateQ = plateQueue;
      var cx = L.x0 + base / 2 + p * (L.x1 - L.x0 - base);
      var ev = activeEvents(i, t);
      var finished = t >= plan.finishTime[i];
      var started = p > 0;
      var running = started && !finished && !ev.stumble;
      var rank = plan.rankOf[i];
      var color = LANE_COLORS[i % LANE_COLORS.length];
      var fix = vfix();
      var py = plates[i];
      var sinceFin = t - plan.finishTime[i];
      var hidden = rank <= 1 && rv !== undefined && !(rv >= 0 && t >= rv);
      var pr2 = hidden ? 1 : rank;             // ポーズ用の順位（発表前は1着も2着と同じ動き）
      var sinceStamp = rank <= 1 ? (rv >= 0 ? t - rv : (rv === undefined ? sinceFin : -1)) : sinceFin;

      // 光の尾 / グロー(boost)
      if (ev.boost) {
        var k = (t - ev.boost.t) / (ev.boost.dur || 1200);
        var a = Math.sin(clamp(k, 0, 1) * Math.PI);
        var tl = size * 3.6;
        var g = ctx.createLinearGradient(cx - tl, 0, cx, 0);
        g.addColorStop(0, 'rgba(255,240,120,0)');
        g.addColorStop(1, 'rgba(255,250,200,' + (0.9 * a).toFixed(2) + ')');
        ctx.fillStyle = g;
        for (var s = 0; s < 3; s++) {
          var yy = yc + (s - 1) * size * 0.2;
          ctx.fillRect(cx - tl * (1 - s * 0.18), yy - size * 0.05, tl * (1 - s * 0.18), size * 0.1);
        }
        var rg = ctx.createRadialGradient(cx, yc, size * 0.1, cx, yc, size * 1.1);
        rg.addColorStop(0, 'rgba(255,255,160,' + (0.95 * a).toFixed(2) + ')');
        rg.addColorStop(1, 'rgba(255,220,0,0)');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(cx, yc, size * 1.1, 0, 6.283); ctx.fill();
      }

      // 姿勢（走り方）。ゴール後は喜ぶ/がっかりポーズ
      var pose;
      if (finished) {
        var fadeIn = ease(sinceFin / 300);
        if (pr2 === 0) {
          pose = gaitPose('hop', t, look.phase, lh * 1.5, 1);
          pose.dy *= fadeIn; pose.rot = 0.12 * Math.sin(t * 0.0144) * fadeIn;
        } else if (pr2 <= 2) {
          pose = gaitPose('hop', t, look.phase, lh * 0.9, 1);
          pose.dy *= fadeIn; pose.rot = 0;
        } else {
          pose = { dy: size * 0.05 * fadeIn, rot: 0.14 * fadeIn, sx: 1, sy: 1 - 0.04 * fadeIn };
        }
      } else {
        pose = gaitPose(look.gait, t, look.phase, lh, running ? 1 : (started ? 0.1 : 0.25));
      }
      var restY = size * 0.04; // 乗り物を少し下げて、顔と帽子の高さを確保
      var hatDy = (gaitPose(finished ? 'hop' : look.gait, t - 110, look.phase, lh, running || finished ? 1 : 0.2).dy - pose.dy) * 0.9;

      // 影＋走者色のマット（乗り物の絵文字の色に頼らず色違いが分かる）
      var air = clamp(-pose.dy / (lh * 0.3), 0, 1);
      var gy = yc + restY + size * 0.4;
      var mrx = size * (0.56 - 0.12 * air), mry = size * (0.1 - 0.02 * air);
      ctx.fillStyle = 'rgba(0,0,0,' + (0.28 - 0.12 * air).toFixed(2) + ')';
      ctx.beginPath(); ctx.ellipse(cx, gy + mry * 0.35, mrx * 1.05, mry * 1.1, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = look.tint;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(3, size * 0.035);
      ctx.beginPath(); ctx.ellipse(cx, gy, mrx, mry, 0, 0, 6.283); ctx.fill(); ctx.stroke();

      // 軌跡（名札の下）
      var ph = Math.min(lh * 0.74, py.fs * 1.5);
      var pr = cx - size * 0.5;
      var px = pr - py.w;
      if (running) drawTrail(i, t, px, yc, size, look);

      // 名前札（走者の後ろ＝左）。揺らさない。全走者を描いた後に最前面へ描く
      plateQ.push(function () {
        var pyy = yc - ph / 2;
        // 影は shadowBlur を使わず、ずらした半透明の板で（描画を軽くする）
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        rrect(ctx, px + 2, pyy + 3, py.w, ph, ph * 0.28);
        ctx.fill();
        ctx.fillStyle = color;
        rrect(ctx, px, pyy, py.w, ph, ph * 0.28);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        rrect(ctx, px, pyy, py.w, ph, ph * 0.28);
        ctx.stroke();
        ctx.font = '900 ' + py.fs + 'px ' + TEXT_FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        outlined(ctx, py.text, px + py.w / 2, yc + py.fs * 0.05, py.fs, '#fff', 'rgba(0,0,0,0.75)', Math.max(3, py.fs * 0.16));
        // v4: 着順スタンプ（ゴールの瞬間に名前札の左へ「ドン！」。1・2着は写真判定の発表のとき）
        if (finished && !hidden && sinceStamp >= 0) drawStamp(px - lh * 0.5, yc, rank + 1, sinceStamp, lh);
      });

      // 乗り物＋乗り手（グループで同じ姿勢）
      var rotTilt = 0;
      var dyTilt = 0;
      if (ev.stumble) {
        var sk = (t - ev.stumble.t) / (ev.stumble.dur || 1000);
        rotTilt = -0.55 * Math.sin(clamp(sk, 0, 1) * Math.PI * 0.5 + 0.2) - 0.1 * Math.sin(t * 0.03);
        dyTilt = size * 0.1;
      }
      ctx.save();
      ctx.translate(cx, yc + restY + pose.dy + dyTilt);
      ctx.rotate(pose.rot + rotTilt);
      ctx.scale(pose.sx, pose.sy);

      // 乗り物本体
      ctx.save();
      var flip = fix.flip;
      if (ev.reverse) flip = !flip;
      var vrot = 0;
      if (fix.rot) vrot = fix.rot * (ev.reverse ? -1 : 1);
      if (flip) ctx.scale(-1, 1);
      if (vrot) ctx.rotate(flip ? -vrot : vrot);
      var sp = sprites[i];
      if (sp) {
        var dw = sp.c.width * size / sp.font;
        ctx.drawImage(sp.c, -dw / 2, -dw / 2, dw, dw);
      } else {
        ctx.font = Math.round(size) + 'px ' + EMOJI_FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#000';
        ctx.fillText(plan.vehicle.emoji, 0, size * 0.04);
      }
      ctx.restore();

      // ゼッケン（走者色の布＋レーン番号）
      var zw = size * 0.36, zh = size * 0.26, zx = size * 0.08 - zw / 2, zy = size * 0.2;
      ctx.fillStyle = look.tint;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(3, size * 0.035);
      rrect(ctx, zx, zy, zw, zh, zh * 0.25); ctx.fill(); ctx.stroke();
      ctx.font = '900 ' + Math.round(zh * 0.8) + 'px ' + TEXT_FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      outlined(ctx, String(i + 1), zx + zw / 2, zy + zh / 2 + zh * 0.04, zh * 0.8, '#fff', 'rgba(0,0,0,0.6)', Math.max(2, zh * 0.14));

      // 顔（丸窓）
      var kind = faceKind(i, t, ev, rk, tension, hidden);
      var emo = look.faces[kind] || look.face;
      var mem = faceMem[i];
      if (!mem || t < mem.since) mem = faceMem[i] = { e: emo, since: -99999 };
      if (mem.e !== emo) { mem.e = emo; mem.since = t; }
      var popk = (t - mem.since) / 320;
      var pop = popk >= 0 && popk < 1 ? 1 + 0.4 * Math.sin(popk * Math.PI) : 1;
      var fr = base * 0.255 * (0.9 + 0.1 * look.size);
      var fcx = size * 0.03, fcy = -size * 0.3;
      ctx.save();
      ctx.translate(fcx, fcy);
      ctx.scale(pop, pop);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = fr * 0.5;
      ctx.beginPath(); ctx.arc(0, 0, fr * 1.03, 0, 6.283); ctx.stroke();
      ctx.strokeStyle = look.tint;
      ctx.lineWidth = fr * 0.34;
      ctx.beginPath(); ctx.arc(0, 0, fr * 1.03, 0, 6.283); ctx.fill(); ctx.stroke();
      drawEmoji(emo, 0, fr * 0.06, fr * 1.7);
      ctx.restore();

      // スカーフ（走者色。顔の下にたなびく）
      ctx.save();
      ctx.translate(fcx, fcy + fr * 1.08);
      ctx.fillStyle = look.tint;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(2.5, fr * 0.14);
      var fl = Math.sin(t * 0.012 + look.phase) * fr * 0.12 * (running ? 1 : 0.3);
      ctx.beginPath();
      ctx.moveTo(-fr * 0.5, -fr * 0.1);
      ctx.lineTo(-fr * 1.5, fr * 0.1 + fl);
      ctx.lineTo(-fr * 1.15, fr * 0.45 + fl);
      ctx.lineTo(-fr * 0.3, fr * 0.2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, fr * 0.78, fr * 0.26, 0, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.restore();

      // 帽子（慣性で遅れて揺れる）
      ctx.save();
      ctx.translate(fcx, fcy - fr * 0.95);
      ctx.translate(0, hatDy);
      ctx.rotate(-pose.rot * 0.6 + 0.2 * Math.sin(t * 0.011 + look.phase) * (running ? 1 : 0.3) - hatDy / lh * 1.6);
      drawHat(look, fr * 1.15, t);
      ctx.restore();

      // 汗（後方・緊張）
      if (!finished && (kind === 'back' || (kind === 'nerv' && tension > 0.8))) {
        var sw2 = frac(t / 900 + look.phase);
        ctx.fillStyle = 'rgba(120,200,255,' + (0.95 - sw2 * 0.6).toFixed(2) + ')';
        ctx.strokeStyle = 'rgba(20,70,140,0.9)';
        ctx.lineWidth = 2;
        var sx0 = fcx + fr * 1.15, sy0 = fcy - fr * 0.5 + sw2 * fr * 1.1;
        ctx.beginPath();
        ctx.moveTo(sx0, sy0 - fr * 0.4);
        ctx.quadraticCurveTo(sx0 + fr * 0.38, sy0 + fr * 0.1, sx0, sy0 + fr * 0.3);
        ctx.quadraticCurveTo(sx0 - fr * 0.38, sy0 + fr * 0.1, sx0, sy0 - fr * 0.4);
        ctx.fill(); ctx.stroke();
      }
      // ぐるぐる星（つまずき）
      if (ev.stumble) {
        ctx.fillStyle = '#ffd400';
        ctx.strokeStyle = '#8a5a00';
        ctx.lineWidth = 2;
        for (var q = 0; q < 3; q++) {
          var qa = t * 0.008 + q * 2.094;
          pc++;
          drawStar(fcx + Math.cos(qa) * fr * 1.5, fcy - fr * 1.3 + Math.sin(qa) * fr * 0.4, fr * 0.42, qa);
          ctx.stroke();
        }
      }
      ctx.restore();

      // イベント記号
      var big = Math.min(lh * 0.95, 80);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (ev.stumble) {
        var wob = 1 + 0.12 * Math.sin(t * 0.02);
        ctx.font = '900 ' + Math.round(big * wob) + 'px ' + TEXT_FONT;
        outlined(ctx, '!?', cx + size * 0.62, yc - lh * 0.3, big, '#ffe600', '#c62828', big * 0.2);
      }
      if (ev.reverse) {
        ctx.font = '900 ' + Math.round(big) + 'px ' + TEXT_FONT;
        outlined(ctx, '↩', cx + size * 0.6, yc - lh * 0.3, big, '#00e5ff', '#003a5c', big * 0.2);
      }
      if (ev.swap) {
        var sw = Math.sin(t * 0.03) * 0.15;
        ctx.save();
        ctx.translate(cx + size * 0.6, yc - lh * 0.3);
        ctx.rotate(sw);
        drawEmoji('⚡', 0, 0, big);
        ctx.restore();
      }

      // ゴール後：1着はキラキラ
      if (finished && rank === 0 && !hidden) {
        for (var z = 0; z < 2; z++) {
          pc++;
          var za = t * 0.004 + z * 3.1;
          drawEmoji('✨', cx + (z ? 1 : -1) * size * 0.62, yc - size * 0.15 + Math.sin(za) * size * 0.2, size * 0.5);
        }
      }

      // ゴール済みバッジ
      if (finished) {
        var bd = Math.min(lh * 0.92, 90);
        var bx = L.x1 + 2 * L.cs + 4 + (W - L.x1 - 2 * L.cs - 4) / 2;
        var bcol, tcol = '#fff', ecol = '#fff';
        var rn = rank + 1;
        if (rn === 1) { bcol = '#f5b800'; tcol = '#3a2600'; }
        else if (rn === 2) { bcol = '#c3cad2'; tcol = '#1e252b'; }
        else if (rn === 3) { bcol = '#c9772b'; tcol = '#2e1600'; }
        else { bcol = '#24304a'; }
        var bpop = ease((hidden ? sinceFin : sinceStamp) / 250);
        var rad = bd / 2 * (0.6 + 0.4 * bpop);
        if (hidden) { bcol = '#5a6170'; tcol = '#fff'; }   // 発表前は「?」
        ctx.fillStyle = bcol;
        ctx.beginPath(); ctx.arc(bx, yc, rad, 0, 6.283); ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = ecol;
        ctx.stroke();
        var rf = rad * (rn >= 10 ? 1.0 : 1.3);
        ctx.font = '900 ' + Math.round(rf) + 'px ' + TEXT_FONT;
        ctx.fillStyle = tcol;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(hidden ? '?' : String(rn), bx, yc + rf * 0.06);
      }
      ctx.textAlign = 'left';
    }

    // 着順スタンプ：丸い判子に「N着」。押した瞬間は大きく、0.22秒で縮んで止まる
    function drawStamp(x, y, rn, since, lh) {
      var k = clamp(since / 220, 0, 1);
      var sc = 1 + 1.3 * (1 - ease(k));
      var r = lh * 0.42;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.22);
      ctx.scale(sc, sc);
      ctx.globalAlpha = 0.25 + 0.7 * ease(k);
      ctx.fillStyle = rn === 1 ? 'rgba(255,215,64,0.95)' : 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
      ctx.lineWidth = Math.max(3, r * 0.14);
      ctx.strokeStyle = '#d0021b';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, 6.283); ctx.lineWidth = Math.max(1.5, r * 0.05); ctx.stroke();
      var fs = r * (rn >= 10 ? 0.62 : 0.78);
      ctx.font = '900 ' + Math.round(fs) + 'px ' + TEXT_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#d0021b';
      ctx.fillText(rn + '着', 0, fs * 0.06);
      ctx.restore();
    }

    // ---------- 緊迫感の演出 ----------
    // 心拍の位相は積分して、テンポが変わってもカクつかないようにする
    function heartBeat(t, tension) {
      var period = lerp(1500, 760, tension);
      if (hb.last === null || t < hb.last || t - hb.last > 400) {
        hb.ph = frac(t / period);
      } else {
        hb.ph = frac(hb.ph + (t - hb.last) / period);
      }
      hb.last = t;
      var x = hb.ph;
      var b1 = Math.exp(-Math.pow((x - 0.05) / 0.07, 2));
      var b2 = 0.6 * Math.exp(-Math.pow((x - 0.28) / 0.07, 2));
      return clamp(b1 + b2, 0, 1);
    }

    // コース上（走者の下）：スピード線・ゴール線の光
    function drawTensionUnder(wid, t, tension, beat) {
      if (tension <= 0.02) return;
      var st = WEATHER_STYLE[wid];
      var trackH = L.n * L.laneH;
      // スピード線（太め・少数・色は天気のインク色）
      if (tension > 0.12) {
        var cnt = Math.round(3 + 7 * tension);
        ctx.lineCap = 'round';
        ctx.strokeStyle = st.ink;
        for (var k = 0; k < cnt; k++) {
          var len = 220 + hash(k, 21) * 360;
          var spd = (0.5 + hash(k, 22) * 0.5) * (0.5 + tension);
          var span = W + len;
          var x = W - (((t * spd + hash(k, 23) * span * 3) % span));
          var y = L.top + (0.05 + hash(k, 24) * 0.9) * trackH;
          var lg = ctx.createLinearGradient(x, 0, x + len, 0);
          lg.addColorStop(0, st.ink);
          lg.addColorStop(1, 'rgba(128,128,128,0)');
          ctx.strokeStyle = lg;
          ctx.globalAlpha = clamp(0.15 + 0.5 * tension, 0, 0.65);
          ctx.lineWidth = 4 + hash(k, 25) * 2;
          pc++;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      // ゴール線の光
      var gx = L.x1;
      var a = tension * (0.4 + 0.4 * beat);
      var gw = L.cs * 2 + 70 + 50 * tension;
      var gg = ctx.createLinearGradient(gx - gw, 0, gx + L.cs, 0);
      gg.addColorStop(0, 'rgba(255,220,60,0)');
      gg.addColorStop(1, 'rgba(255,235,120,' + a.toFixed(3) + ')');
      ctx.fillStyle = gg;
      ctx.fillRect(gx - gw, L.top, gw + L.cs, trackH);
      ctx.save();
      ctx.shadowColor = 'rgba(255,230,80,' + clamp(a * 1.4, 0, 1).toFixed(2) + ')';
      ctx.shadowBlur = 30 + 30 * tension;
      ctx.fillStyle = 'rgba(255,250,200,' + clamp(0.35 + 0.65 * tension * (0.6 + 0.4 * beat), 0, 1).toFixed(2) + ')';
      ctx.fillRect(gx - 4, L.top, 8, trackH);
      ctx.restore();
    }

    // 画面端の赤い心拍ビネット
    function drawHeartVignette(tension, beat) {
      if (tension <= 0.02) return;
      var a = tension * (0.4 + 0.45 * beat);
      var diag = Math.sqrt(W * W + H * H);
      var g = ctx.createRadialGradient(W / 2, H / 2, diag * lerp(0.3, 0.14, tension), W / 2, H / 2, diag * 0.5);
      g.addColorStop(0, 'rgba(210,0,25,0)');
      g.addColorStop(1, 'rgba(215,0,30,' + clamp(a, 0, 0.85).toFixed(3) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // ---------- 天気の前景（粒子数は控えめ。全体予算: 天気<=24 + 軌跡<=24 + スピード線<=10 で 60 以内） ----------
    function drawWeatherFront(wid, t) {
      var k, x, y;
      if (wid === 'rain' || wid === 'thunder' || wid === 'storm') {
        ctx.fillStyle = 'rgba(30,50,80,0.14)';
        ctx.fillRect(0, 0, W, H);
        var cnt = wid === 'rain' ? 18 : 20;
        ctx.lineCap = 'round';
        for (k = 0; k < cnt; k++) {
          var sp = 0.55 + hash(k, 4) * 0.25;
          y = ((hash(k, 2) + t * 0.0007 * sp) % 1) * (H + 120) - 60;
          x = hash(k, 1) * (W + 200) - 100 - (y * 0.25);
          ctx.strokeStyle = 'rgba(40,90,170,0.7)';
          ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 14, y + 52); ctx.stroke();
          ctx.strokeStyle = 'rgba(200,225,255,0.85)';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 14, y + 52); ctx.stroke();
        }
        if (wid !== 'rain') {
          var ph = (t % 4000) / 4000;
          if (ph < 0.06) {
            ctx.fillStyle = 'rgba(255,255,255,' + (0.35 * (1 - ph / 0.06)).toFixed(2) + ')';
            ctx.fillRect(0, 0, W, H);
          }
        }
      } else if (wid === 'snow') {
        for (k = 0; k < 16; k++) {
          var r = 8 + hash(k, 3) * 7;
          y = ((hash(k, 2) + t * 0.00007 * (0.7 + hash(k, 5))) % 1) * (H + 40) - 20;
          x = hash(k, 1) * W + Math.sin(t * 0.0011 + k) * 24;
          ctx.fillStyle = 'rgba(255,255,255,0.95)';
          ctx.strokeStyle = 'rgba(70,110,170,0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.stroke();
        }
      } else if (wid === 'fog') {
        for (k = 0; k < 5; k++) {
          y = H * (0.14 + 0.17 * k) + Math.sin(t * 0.0004 + k) * 14;
          var bw = W * 0.55, bh = H * 0.07;
          var off = ((t * 0.02 * (0.6 + k * 0.15) + k * 500) % (W + bw * 2)) - bw;
          ctx.save();
          ctx.translate(off, y);
          ctx.scale(1, bh / bw);
          var g = ctx.createRadialGradient(0, 0, 0, 0, 0, bw);
          g.addColorStop(0, 'rgba(240,242,246,0.5)');
          g.addColorStop(1, 'rgba(240,242,246,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(0, 0, bw, 0, 6.283); ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = 'rgba(225,230,235,0.08)';
        ctx.fillRect(0, 0, W, H);
      } else if (wid === 'sunset') {
        var sg = ctx.createLinearGradient(0, 0, W, 0);
        sg.addColorStop(0, 'rgba(255,90,40,0.22)');
        sg.addColorStop(1, 'rgba(255,150,60,0.05)');
        ctx.fillStyle = sg;
        ctx.fillRect(0, 0, W, H);
        var vg = ctx.createLinearGradient(0, H * 0.6, 0, H);
        vg.addColorStop(0, 'rgba(120,30,40,0)');
        vg.addColorStop(1, 'rgba(120,30,40,0.25)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, H * 0.6, W, H * 0.4);
      } else if (wid === 'night') {
        ctx.fillStyle = 'rgba(5,10,40,0.16)';
        ctx.fillRect(0, 0, W, H);
        for (k = 0; k < 8; k++) {
          // ふわふわ光る蛍
          x = hash(k, 8) * W + Math.sin(t * 0.0006 + k * 2) * 40;
          y = L.top + hash(k, 9) * (H - L.top - L.bot);
          var a = 0.4 + 0.4 * Math.sin(t * 0.003 + k);
          ctx.fillStyle = 'rgba(255,255,140,' + a.toFixed(2) + ')';
          ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.283); ctx.fill();
        }
      } else if (wid === 'wind') {
        ctx.lineCap = 'round';
        for (k = 0; k < 8; k++) {
          var spd = 0.5 + hash(k, 4) * 0.5;
          x = ((hash(k, 1) + t * 0.00035 * spd) % 1) * (W + 600) - 300;
          y = hash(k, 2) * H;
          var len = 140 + hash(k, 6) * 160;
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.bezierCurveTo(x + len * 0.3, y - 14, x + len * 0.6, y + 14, x + len, y);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(30,110,100,0.55)';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        // 舞う葉っぱ
        for (k = 0; k < 3; k++) {
          x = ((hash(k, 11) + t * 0.0003) % 1) * (W + 200) - 100;
          y = hash(k, 12) * H + Math.sin(t * 0.002 + k) * 30;
          ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.003 + k); drawEmoji('🍃', 0, 0, 40); ctx.restore();
        }
        ctx.textAlign = 'left';
      } else if (wid === 'cloudy') {
        ctx.fillStyle = 'rgba(70,80,95,0.12)';
        ctx.fillRect(0, 0, W, H);
      }
    }

    function draw(t, view) {
      if (!plan || !L) return;
      view = view || {};
      t = t || 0;
      var wid = weatherId();
      var zoom = ease(view.zoom || 0);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      // ズーム
      var s = 1 + 1.2 * zoom;
      var tx = 0, ty = 0;
      if (zoom > 0 && plan.photo) {
        var ra = laneRect(plan.photo.a), rb = laneRect(plan.photo.b);
        // v4: 1着・2着のレーンが離れていても2人とも画面に入るよう、寄りを弱める
        var span = Math.abs(ra.y - rb.y) + ra.h + L.laneH * 0.6;
        var sMax = clamp(H * 0.92 / span, 1, 2.2);
        s = 1 + (sMax - 1) * zoom;
        var fx = L.x1 - L.emoji * 0.6;
        var fy = (ra.y + ra.h / 2 + rb.y + rb.h / 2) / 2;
        var cx = lerp(fx, W * 0.6, zoom);
        var cy = lerp(fy, H * 0.5, zoom);
        tx = cx - fx * s;
        ty = cy - fy * s;
        tx = clamp(tx, W - W * s, 0);
        ty = clamp(ty, H - H * s, 0);
      }

      ctx.save();
      ctx.translate(tx, ty);
      ctx.scale(s, s);
      var tension = clamp(view.tension || 0, 0, 1);
      var beat = tension > 0 ? heartBeat(t, tension) : 0;
      pc = 0;
      drawSky(wid, t);
      drawTrack(wid, t);
      drawTensionUnder(wid, t, tension, beat);
      drawWeatherFront(wid, t);   // 天気は走者・名前札の背面
      var i;
      var ranks = ranksAt(t);
      plateQueue = [];
      for (i = 0; i < L.n; i++) drawRunner(i, t, ranks[i], tension, view.reveal);
      for (i = 0; i < plateQueue.length; i++) plateQueue[i]();
      plateQueue = [];
      ctx.restore();

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawHeartVignette(tension, beat);
      api.particles = pc;

      if (view.slow) {
        var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,0.38)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
      }

      if (view.frozen) {
        ctx.save();
        ctx.globalCompositeOperation = 'saturation';
        ctx.fillStyle = '#808080';
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
        ctx.fillStyle = 'rgba(80,80,90,0.28)';
        ctx.fillRect(0, 0, W, H);
      }

      if (view.flash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + clamp(view.flash, 0, 1).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }

    // 写真判定のフィルム用：演出なしの1枚を裏で描き、1着・2着のレーンのゴール付近だけを切り出して上下に並べる
    //（レーンが離れていても2人とも写る。どちらが1着かは分からないよう、レーン番号の順に並べる）
    function photo(t) {
      if (!plan || !L || typeof document === 'undefined') return snapshot();
      var off = document.createElement('canvas');
      off.width = canvas.width; off.height = canvas.height;
      var keep = ctx;
      ctx = off.getContext('2d');
      try { draw(t, { zoom: 0, slow: false, frozen: false, flash: 0, tension: 0, reveal: -1 }); } finally { ctx = keep; }
      var lanes = [plan.photo.a, plan.photo.b].sort(function (x, y) { return x - y; });
      var lh = L.laneH, gap = Math.max(4, lh * 0.06);
      var cw = Math.min(W, L.maxPlate + L.emoji * 2.2 + L.cs * 2 + 16);
      var sx = Math.max(0, L.x1 + L.cs * 2 + 8 - cw);
      var out = document.createElement('canvas');
      out.width = Math.round(cw * dpr); out.height = Math.round((lh * 2 + gap) * dpr);
      var o = out.getContext('2d');
      o.fillStyle = '#000'; o.fillRect(0, 0, out.width, out.height);
      lanes.forEach(function (i, k) {
        o.drawImage(off, sx * dpr, (L.top + i * lh) * dpr, cw * dpr, lh * dpr, 0, k * (lh + gap) * dpr, cw * dpr, lh * dpr);
      });
      var gx = (L.x1 - sx) * dpr;
      o.strokeStyle = 'rgba(255,30,30,0.95)'; o.lineWidth = Math.max(2, 3 * dpr);
      o.beginPath(); o.moveTo(gx, 0); o.lineTo(gx, out.height); o.stroke();
      return out;
    }

    function snapshot() {
      var c = document.createElement('canvas');
      c.width = canvas.width;
      c.height = canvas.height;
      var cx = c.getContext('2d');
      cx.drawImage(canvas, 0, 0);
      return c;
    }

    api = { setPlan: setPlan, resize: resize, draw: draw, snapshot: snapshot, photo: photo, laneRect: laneRect, looks: looks, particles: 0 };
    return api;
  }

  return { create: create, LANE_COLORS: LANE_COLORS };
})();

</script>
<script>
/* app.js */
/* app.js - 画面遷移・統合・演出オーバーレイ */
var RR = (typeof window !== 'undefined') ? (window.RR = window.RR || {}) : {};

(function () {
  'use strict';
  if (typeof window === 'undefined') return;

  // ---------- テスト用ログ ----------
  var log = window.__raceLog = { goalOrder: [], resultOrder: [], done: false, errors: [], subs: [] };
  function logErr(msg) { try { log.errors.push(String(msg)); } catch (e) {} }
  window.onerror = function (msg, src, line, col) {
    logErr(msg + ' @' + (src || '') + ':' + line + ':' + col);
    return false;
  };
  window.addEventListener('unhandledrejection', function (ev) {
    logErr('unhandledrejection: ' + (ev && ev.reason && (ev.reason.message || ev.reason)));
  });

  // ---------- ユーティリティ ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function aud(fn) {
    try {
      var A = RR.Audio;
      if (A && typeof A[fn] === 'function') return A[fn].apply(A, Array.prototype.slice.call(arguments, 1));
    } catch (e) { logErr('audio.' + fn + ': ' + e.message); }
    return undefined;
  }

  // 現在の順位（先頭が [0]）

  function timeStr(mins) { mins = ((mins % 1440) + 1440) % 1440; return pad2(Math.floor(mins / 60)) + ':' + pad2(mins % 60); }

  // 走者の見た目（renderer.looks[i]）を乗り物＋帽子＋顔で小さく添える。looks が無ければ乗り物のみ。
  function lookHtml(i, rank) {
    var plan = S.plan, lk = rend && rend.looks && rend.looks[i];
    var veh = esc(plan.vehicle.emoji);
    if (!lk) return '<span class="vh">' + veh + '</span> ';
    var f = '';
    if (typeof lk.hue === 'number' && isFinite(lk.hue)) f = 'hue-rotate(' + Math.round(lk.hue) + 'deg) saturate(1.3)';
    else if (typeof lk.hue === 'string' && /^[a-z\-]+\([^;"<>]*\)(\s+[a-z\-]+\([^;"<>]*\))*$/i.test(lk.hue)) f = lk.hue;
    var hat = typeof lk.hat === 'string' ? ({ horn: '🦄', prop: '🌀' }[lk.hat] || lk.hat) : '';
    var face = rank === 0 ? '🥳' : (rank <= 2 ? '😄' : '😌');
    return '<span class="vh"' + (f ? ' style="filter:' + f + '"' : '') + '>' + veh + '</span>' +
      '<span class="lk">' + esc(hat) + esc(face) + '</span> ';
  }

  function showResult() {
    var plan = S.plan, st = S;
    S.phase = 'result';
    clearTimers();
    aud('stopLoop'); aud('setSlow', false); aud('setTension', 0); aud('cancelSpeech');
    hideOverlays();
    show('result');

    var startMin = parseTime($('optStart').value); if (startMin === null) startMin = 13 * 60;
    var per = parseInt($('optMin').value, 10); if (!(per >= 1)) per = 8;
    var order = plan.order, n = plan.n;

    // 表彰台
    var pod = $('podium'); pod.innerHTML = '';
    var medals = ['🥇', '🥈', '🥉'];
    [1, 0, 2].filter(function (r) { return r < Math.min(n, 3); }).forEach(function (r) {
      var d = document.createElement('div');
      d.className = 'pod p' + (r + 1);
      // v4: 絵文字は名前の上の行に分け、名前は長さに合わせて文字を小さくする（「前後…」のように切れないように）
      var name = plan.names[order[r]];
      d.innerHTML = '<div class="who"><div class="whoLk">' + lookHtml(order[r], r) + '</div><div class="whoNm" style="font-size:' +
        fitEm(name, r === 0 ? 5 : 5.5).toFixed(2) + 'em">' + esc(name) + '</div></div><div class="block">' + medals[r] + ' ' + (r + 1) + '</div>';
      pod.appendChild(d);
    });

    // リスト＋タイムテーブル
    var ol = $('orderList'); ol.innerHTML = '';
    var rows = n > 6 ? Math.ceil(n / 2) : n;
    ol.classList.toggle('two', n > 6);
    ol.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 6.2vh))';
    var lines = [];
    log.resultOrder.length = 0;
    order.forEach(function (idx, k) {
      var s = startMin + k * per, e = s + per, name = plan.names[idx];
      var range = timeStr(s) + '〜' + timeStr(e);
      lines.push(range + ' ' + name + 'さん');
      log.resultOrder.push(name);
      var li = document.createElement('li');
      li.style.animationDelay = (0.3 + k * 0.12) + 's';
      li.innerHTML = '<span class="rk">' + (k + 1) + '</span><span class="nm">' + lookHtml(idx, k) + esc(name) + 'さん</span><span class="tm">' + range + '</span>';
      ol.appendChild(li);
    });
    st.timetable = lines.join('\n');

    // 封筒
    var env = $('envelope');
    env.classList.remove('open');
    env.innerHTML = '✉️ 封印の封筒を開封します……';
    st.envOpened = false;
    later(openEnvelope, 2200 / speed);

    // 紙吹雪（少なめ・大きめ・ゆっくり）
    var cf = $('confetti'); cf.innerHTML = '';
    var cols = ['#ffd23f', '#ff4d6d', '#3be0ff', '#5dff9c', '#ff9f1c', '#c58bff'];
    for (var i = 0; i < 40; i++) {
      var c = document.createElement('i');
      var sz = 18 + Math.random() * 14;
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.width = sz + 'px'; c.style.height = (sz * 0.6) + 'px';
      c.style.background = cols[i % cols.length];
      c.style.animationDuration = (7 + Math.random() * 5) + 's';
      c.style.animationDelay = (Math.random() * 3) + 's';
      cf.appendChild(c);
    }
    aud('play', 'fanfare');
    resultBanter(plan, st);
    log.done = true;
  }

  // 結果画面の締めの掛け合い（読み上げのみ。画面の発表順リストが字幕の代わり）
  function resultBanter(plan, st) {
    var first = plan.names[plan.order[0]], lastN = plan.names[plan.order[plan.n - 1]];
    var lines = [
      ['ana', 'トップバッターは' + first + 'さん！'],
      ['kai', pickOne(['先陣、お願いします', '一番乗りです！', '勢いそのままでどうぞ'])],
      ['ana', '大トリは' + lastN + 'さん！'],
      ['kai', pickOne(['締めくくり、楽しみです', '最後まで目が離せません', '主役は最後に登場です'])]
    ];
    function go(k) {
      if (S !== st || S.phase !== 'result' || k >= lines.length) return;
      aud('speak', lines[k][1], lines[k][0], { priority: 'high', maxWaitMs: 2000, fallbackMs: 1,
        onend: function () { later(function () { go(k + 1); }, 150 / speed); },
        ondrop: function () {} });
    }
    if (plan.n >= 2) later(function () { go(0); }, 1600 / speed);
  }
  function pickOne(a) { return a[Math.floor(Math.random() * a.length)]; }

  function openEnvelope() {
    if (!S || S.phase !== 'result' || S.envOpened) return;
    S.envOpened = true;
    var env = $('envelope');
    env.classList.add('open');
    env.innerHTML = '📜 封印コード <b>' + esc(S.plan.sealCode) + '</b>（レース前と同じ！）';
    aud('play', 'tick');
  }

  function copyTimetable() {
    if (!S || !S.timetable) return;
    var text = S.timetable, btn = $('btnCopy');
    function done(msg) { btn.textContent = msg; setTimeout(function () { btn.textContent = '📋 タイムテーブルをコピー'; }, 2200); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok ? 'コピーしました！' : 'コピーできませんでした');
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done('コピーしました！'); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }

  // ---------- 起動 ----------
  function startFromSetup() {
    if (!validate()) return;
    saveSetup();
    beginRace(parsedNames.slice());
  }

  function init() {
    loadSetup();
    refreshControls();
    validate();

    $('names').addEventListener('input', function () { validate(); saveSetup(); });
    $('optStart').addEventListener('input', function () { validate(); saveSetup(); });
    $('optMin').addEventListener('input', function () { validate(); saveSetup(); });
    $('optSpeech').addEventListener('change', function () { setSpeech(this.checked); });
    $('btnStart').addEventListener('click', function () { this.blur(); startFromSetup(); });

    $('btnSound').addEventListener('click', function () {
      muted = !muted; aud('setMuted', muted); refreshControls(); this.blur();
    });
    $('btnSpeech').addEventListener('click', function () { setSpeech(!speechOn); this.blur(); });
    $('btnShare').addEventListener('click', function () { $('shareNote').hidden = !$('shareNote').hidden; this.blur(); });

    $('intro').addEventListener('click', function () { if (S && S.skip) S.skip(); });
    $('envelope').addEventListener('click', openEnvelope);
    $('btnCopy').addEventListener('click', function () { copyTimetable(); this.blur(); });
    $('btnAgain').addEventListener('click', function () { this.blur(); if (S) beginRace(S.names.slice()); });
    $('btnChange').addEventListener('click', function () {
      this.blur();
      if (S) { clearTimers(); S.phase = 'setup'; }
      aud('stopLoop'); aud('cancelSpeech');
      hideOverlays();
      show('setup'); validate();
    });

    document.addEventListener('pointerdown', initAudioOnce, true);
    document.addEventListener('keydown', initAudioOnce, true);

    document.addEventListener('keydown', function (e) {
      if (!(e.key === ' ' || e.code === 'Space' || e.key === 'Enter')) return;
      var tag = e.target && e.target.tagName;
      if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'BUTTON' || tag === 'SELECT') return;
      e.preventDefault();
      if (e.repeat) return;
      if (currentScreen === 'setup') startFromSetup();
      else if (currentScreen === 'race') { if (S && S.phase === 'intro' && S.skip) S.skip(); }
      else if (currentScreen === 'result') openEnvelope();
    });

    window.addEventListener('resize', function () { if (rend) { try { rend.resize(); } catch (e) {} } });
    window.requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  RR.App = { version: 1 };
})();

</script>
</body>
